---
# Remote-only connection settings. localhost must never inherit this contract.
ansible_host: "{{ wireguard_address }}"
wireguard_node_address: "{{ wireguard_address }}"

ansible_connection: ssh
ansible_user: >-
  {{
    (node_lima_guest | default(false) | bool)
    | ternary(lima_guest_user, default_ssh_user)
  }}
ansible_port: "{{ default_ssh_port }}"
ansible_become: true
ansible_become_method: sudo
ansible_ssh_private_key_file: >-
  {{
    (node_lima_guest | default(false) | bool)
    | ternary(lima_home_dir ~ '/_config/user', ssh_private_key_file)
  }}
ansible_ssh_common_args: >-
  -F /dev/null -o BatchMode=yes -o ControlMaster=no -o ControlPath=none
  -o HostKeyAlias={{ inventory_hostname }} -o StrictHostKeyChecking=yes
  -o UserKnownHostsFile={{ known_hosts_file }}
  -o IdentitiesOnly=yes
