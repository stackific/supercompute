---
# Remote-only connection settings. localhost must never inherit this contract.
ansible_host: "{{ prod_wireguard_address }}"
wireguard_node_address: "{{ prod_wireguard_address }}"

ansible_connection: "{{ prod_connection }}"
ansible_user: "{{ prod_default_ssh_user }}"
ansible_port: "{{ prod_default_ssh_port }}"
ansible_become: true
ansible_become_method: sudo
ansible_ssh_private_key_file: "{{ prod_ssh_private_key_file }}"
ansible_ssh_common_args: >-
  -F /dev/null -o BatchMode=yes -o ControlMaster=no -o ControlPath=none
  -o HostKeyAlias={{ inventory_hostname }} -o StrictHostKeyChecking=yes
  -o UserKnownHostsFile={{ prod_known_hosts }}
  -o IdentitiesOnly=yes
