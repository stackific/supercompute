---
ansible_host: "{{ private_address }}"
ansible_user: "{{ hostvars[inventory_hostname].ansible_user | default(default_ssh_user) }}"
ansible_port: "{{ default_ssh_port }}"
ansible_become: true
ansible_become_method: sudo
ansible_ssh_private_key_file: "{{ hostvars[inventory_hostname].ansible_ssh_private_key_file | default(ssh_private_key_file) }}"
ansible_ssh_common_args: >-
  -F /dev/null -o BatchMode=yes -o ControlMaster=no -o ControlPath=none
  -o ServerAliveInterval=15 -o ServerAliveCountMax=30 -o ConnectTimeout=30
  -o HostKeyAlias={{ inventory_hostname }} -o StrictHostKeyChecking=yes
  -o UserKnownHostsFile={{ known_hosts_file }}
  -o IdentitiesOnly=yes
