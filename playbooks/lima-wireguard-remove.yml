---
- name: Safely remove Lima provider WireGuard lockdown
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  environment:
    LIMA_HOME: "{{ lima_home_dir }}"
    LIMA_SSH_PORT_FORWARDER: "false"
  pre_tasks:
    - name: Refuse non-Lima providers for this WireGuard slice
      ansible.builtin.assert:
        that:
          - provider.platform == 'lima'
          - provider.mode == 'local'
        fail_msg: >-
          WireGuard wg-remove for PROVIDER={{ inventory_slug }} requires a Lima
          local provider. Public-endpoint WireGuard is the next slice.
  roles:
    - lima_wireguard_remove
