---
- name: Classify static vs roaming nodes and pick the static hub
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Require a public-endpoint provider for WireGuard
      ansible.builtin.assert:
        that:
          - provider.platform == 'public'
          - provider.mode == 'remote'
        fail_msg: >-
          wireguard-up requires provider.platform=public for
          PROVIDER={{ inventory_slug }}.

    - name: Reset classified WireGuard node lists
      ansible.builtin.set_fact:
        wireguard_static_nodes: []
        wireguard_roaming_nodes: []

    - name: Classify each WireGuard inventory node
      ansible.builtin.set_fact:
        wireguard_static_nodes: >-
          {{
            wireguard_static_nodes
            + ([] if (hostvars[item].wireguard_roaming | default(false) | bool) else [item])
          }}
        wireguard_roaming_nodes: >-
          {{
            wireguard_roaming_nodes
            + ([item] if (hostvars[item].wireguard_roaming | default(false) | bool) else [])
          }}
      loop: "{{ groups['wireguard_nodes'] | sort }}"
      loop_control:
        label: "{{ item }}"

    - name: Record roaming presence and the static hub hostname
      ansible.builtin.set_fact:
        wireguard_has_roaming: "{{ wireguard_roaming_nodes | length > 0 }}"
        wireguard_hub: "{{ wireguard_static_nodes | first | default('') }}"

    - name: Require at least one static public host when roaming nodes are present
      ansible.builtin.assert:
        that:
          - wireguard_hub | length > 0
        fail_msg: >-
          Roaming nodes need a static public endpoint hub for Mac↔roaming mesh traffic.
          Add a non-roaming static-N host before roaming-N.
      when: wireguard_has_roaming | bool

    - name: Explain Mac↔roaming routing through the static hub
      ansible.builtin.debug:
        msg: >-
          Roaming mesh path uses static hub {{ wireguard_hub }}
          (no inbound UDP {{ wireguard_listen_port }} required on the Mac).
          Roaming nodes: {{ wireguard_roaming_nodes | join(', ') }}.
      when: wireguard_has_roaming | bool

- name: Configure the macOS controller side of the WireGuard mesh
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Install macOS WireGuard controller when using the Mac control plane
      ansible.builtin.include_role:
        name: wireguard_controller
      when: control_plane | default('mac') != 'gha'

- name: Select the server transport without assuming public SSH remains open
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Probe mesh SSH access to every server
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].wireguard_node_address }}"
        port: "{{ hostvars[item].ansible_port | default(default_ssh_port) }}"
        timeout: >-
          {{
            15
            if (
              (hostvars[item].wireguard_roaming | default(false) | bool)
              or (hostvars[item].node_lima_guest | default(false) | bool)
            )
            else 3
          }}
        connect_timeout: >-
          {{
            15
            if (
              (hostvars[item].wireguard_roaming | default(false) | bool)
              or (hostvars[item].node_lima_guest | default(false) | bool)
            )
            else 3
          }}
        state: started
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "macOS -> {{ item }} through WireGuard"
      register: wireguard_mesh_ssh_probes
      failed_when: false
      changed_when: false

    - name: Index per-host mesh SSH reachability from the probe results
      ansible.builtin.set_fact:
        wireguard_mesh_reachable: >-
          {{
            wireguard_mesh_reachable | default({})
            | combine({item.item: (item.state | default('') == 'started')})
          }}
      loop: "{{ wireguard_mesh_ssh_probes.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Record whether every server is already reachable through WireGuard
      ansible.builtin.set_fact:
        wireguard_mesh_ssh_ready: >-
          {{
            (
              wireguard_mesh_reachable.values()
              | select
              | list
              | length
            ) == (groups['wireguard_nodes'] | length)
          }}

    - name: Explain the selected server transport
      ansible.builtin.debug:
        msg: >-
          {{
            wireguard_mesh_ssh_ready | bool
            | ternary(
                'All nodes are reachable through WireGuard; reconciling them through mesh SSH.',
                'One or more nodes are not reachable through WireGuard; bootstrap recovery SSH is required (public endpoint, Lima-local SSH for node_lima_guest, or Cloudflare for non-Lima roaming).'
              )
          }}

- name: Require reachable bootstrap SSH only when the mesh needs recovery
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for direct public SSH access to every stable server that is off-mesh
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].wireguard_endpoint }}"
        port: "{{ hostvars[item].ansible_port | default(default_ssh_port) }}"
        timeout: 30
        connect_timeout: 5
        state: started
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "macOS -> {{ item }} public recovery SSH"
      when:
        - not (wireguard_mesh_reachable[item] | default(false) | bool)
        - not (hostvars[item].wireguard_roaming | default(false) | bool)

    - name: Wait for Lima-local SSH to every off-mesh Lima guest
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: >-
          {{
            lima_nodes
            | selectattr('name', 'equalto', item)
            | map(attribute='ssh_port')
            | first
          }}
        timeout: 30
        connect_timeout: 5
        state: started
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "macOS -> {{ item }} Lima SSH"
      when:
        - not (wireguard_mesh_reachable[item] | default(false) | bool)
        - hostvars[item].node_lima_guest | default(false) | bool

- name: Reconcile each server through WireGuard or bootstrap recovery SSH
  hosts: wireguard_nodes
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    node_mesh_reachable: >-
      {{ hostvars['localhost'].wireguard_mesh_reachable[inventory_hostname] | default(false) | bool }}
    node_lima_guest: "{{ hostvars[inventory_hostname].node_lima_guest | default(false) | bool }}"
    node_lima_ssh_port: >-
      {{
        lima_nodes
        | default([])
        | selectattr('name', 'equalto', inventory_hostname)
        | map(attribute='ssh_port')
        | list
        | first
        | default(default_ssh_port)
      }}
    ansible_host: >-
      {{
        node_mesh_reachable
        | ternary(
            wireguard_node_address,
            (
              node_lima_guest
              | ternary(
                  '127.0.0.1',
                  (
                    (wireguard_roaming | default(false) | bool)
                    | ternary(bootstrap_ssh_host, wireguard_endpoint)
                  )
                )
            )
          )
      }}
    ansible_port: >-
      {{
        (
          (not node_mesh_reachable)
          and node_lima_guest
        )
        | ternary(
            node_lima_ssh_port,
            hostvars[inventory_hostname].ansible_port | default(default_ssh_port)
          )
      }}
    ansible_user: >-
      {{
        node_lima_guest
        | ternary(
            lima_guest_user,
            hostvars[inventory_hostname].ansible_user | default(default_ssh_user)
          )
      }}
    ansible_ssh_private_key_file: >-
      {{
        node_lima_guest
        | ternary(
            lima_home_dir ~ '/_config/user',
            hostvars[inventory_hostname].ansible_ssh_private_key_file | default(ssh_private_key_file)
          )
      }}
    ansible_ssh_common_args: >-
      -F /dev/null -o BatchMode=yes -o ControlMaster=no -o ControlPath=none
      -o HostKeyAlias={{ inventory_hostname }} -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile={{ known_hosts_file }}
      -o IdentitiesOnly=yes
      {% if (not node_mesh_reachable)
            and (wireguard_roaming | default(false) | bool)
            and (not node_lima_guest) %}
      -o ProxyCommand="{{ lookup('ansible.builtin.pipe', 'command -v cloudflared') }} access ssh --hostname %h"
      {% endif %}
  roles:
    - wireguard_node

- name: Prove macOS can reach every server through the mesh
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for WireGuard SSH access to each server
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].wireguard_node_address }}"
        port: "{{ hostvars[item].ansible_port | default(default_ssh_port) }}"
        timeout: "{{ 90 if (hostvars[item].wireguard_roaming | default(false) | bool) else 30 }}"
        connect_timeout: 5
        state: started
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "macOS -> {{ item }}"
      register: wireguard_mesh_ssh_proof
      failed_when: false

    - name: Fail clearly when Mac cannot reach a node through the mesh
      ansible.builtin.fail:
        msg: >-
          macOS could not open TCP {{ hostvars[item.item].ansible_port | default(default_ssh_port) }}
          on {{ hostvars[item.item].wireguard_node_address }} ({{ item.item }}) through WireGuard.
          {% if hostvars[item.item].wireguard_roaming | default(false) | bool %}
          Mac↔roaming is routed via static hub {{ wireguard_hub | default('(unset)') }}.
          Confirm hub IP forwarding, static-host UDP {{ wireguard_listen_port }}, and that roaming
          has an Endpoint to the hub, then re-run up.
          {% else %}
          Confirm the public endpoint/firewall and re-run up.
          {% endif %}
      when: item.state | default('') != 'started'
      loop: "{{ wireguard_mesh_ssh_proof.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: Prove every server can reach every peer through the mesh
  hosts: wireguard_nodes
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    ansible_host: "{{ wireguard_node_address }}"
    ansible_user: >-
      {{
        (node_lima_guest | default(false) | bool)
        | ternary(
            lima_guest_user,
            hostvars[inventory_hostname].ansible_user | default(default_ssh_user)
          )
      }}
    ansible_ssh_private_key_file: >-
      {{
        (node_lima_guest | default(false) | bool)
        | ternary(
            lima_home_dir ~ '/_config/user',
            hostvars[inventory_hostname].ansible_ssh_private_key_file | default(ssh_private_key_file)
          )
      }}
    ansible_ssh_common_args: >-
      -F /dev/null -o BatchMode=yes -o ControlMaster=no -o ControlPath=none
      -o HostKeyAlias={{ inventory_hostname }} -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile={{ known_hosts_file }}
      -o IdentitiesOnly=yes
  tasks:
    - name: Wait for WireGuard SSH access to each peer
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].wireguard_node_address }}"
        port: "{{ hostvars[item].ansible_port | default(default_ssh_port) }}"
        timeout: 30
        connect_timeout: 5
        state: started
      loop: "{{ groups['wireguard_nodes'] | difference([inventory_hostname]) }}"
      loop_control:
        label: "{{ inventory_hostname }} -> {{ item }}"

    - name: Show the healthy server WireGuard interface without private keys
      ansible.builtin.command:
        argv: [wg, show, "{{ wireguard_interface }}"]
      become: true
      changed_when: false
