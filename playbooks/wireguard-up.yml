---
- name: Bootstrap WireGuard through ordinary Lima access
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  environment:
    LIMA_HOME: "{{ lima_home_dir }}"
    LIMA_SSH_PORT_FORWARDER: "false"
  pre_tasks:
    - name: Refuse non-Lima providers for this WireGuard slice
      ansible.builtin.assert:
        that:
          - provider.platform == 'lima'
          - provider.mode == 'local'
        fail_msg: >-
          WireGuard wg-up for PROVIDER={{ inventory_slug }} requires a Lima
          local provider. Public-endpoint WireGuard is the next slice.
  roles:
    - wireguard_controller

- name: Activate restricted management access through WireGuard
  hosts: wireguard_nodes
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - wireguard_lockdown

- name: Verify post-WireGuard guest services and mesh
  hosts: wireguard_nodes
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Wait for WireGuard SSH access
      ansible.builtin.wait_for_connection:
        timeout: 30
    - name: Run post-WireGuard guest acceptance checks
      ansible.builtin.include_role:
        name: wireguard_verify
        tasks_from: after-guest

- name: Verify post-WireGuard controller acceptance checks
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  environment:
    LIMA_HOME: "{{ lima_home_dir }}"
    LIMA_SSH_PORT_FORWARDER: "false"
  tasks:
    - name: Run post-WireGuard controller acceptance checks
      ansible.builtin.include_role:
        name: wireguard_verify
        tasks_from: after-controller
