---
- name: Show macOS WireGuard status
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require a public-endpoint provider for WireGuard status
      ansible.builtin.assert:
        that:
          - provider.platform == 'public'
        fail_msg: >-
          cloud-wireguard-status requires provider.platform=public for
          PROVIDER={{ inventory_slug }}.
  tasks:
    - name: Show macOS WireGuard peers
      ansible.builtin.command:
        argv: [wg, show]
      become: true
      changed_when: false

- name: Show server WireGuard status
  hosts: wireguard_nodes
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Show node WireGuard peer state
      ansible.builtin.command:
        argv: [wg, show, "{{ cloud_wireguard_interface }}"]
      become: true
      changed_when: false
