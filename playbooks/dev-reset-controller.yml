---
- name: Disconnect dev controller WireGuard before reset
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require the dev reset confirmation
      ansible.builtin.assert:
        that:
          - inventory_slug == 'dev'
          - lookup('ansible.builtin.env', 'CONFIRM') == 'reset-dev'
        fail_msg: >-
          dev-reset controller cleanup requires CONFIRM=reset-dev.

    - name: Check for tracked dev controller WireGuard state
      ansible.builtin.stat:
        path: "{{ wireguard_config_path }}"
      register: dev_reset_controller_config

    - name: Disconnect orphaned dev controller WireGuard when tracked state is absent
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir | dirname }}/scripts/dev_reset_controller_wireguard.py"
          - --provider
          - "{{ inventory_slug }}"
      environment:
        CONFIRM: reset-dev
        PROVIDER: "{{ inventory_slug }}"
      become: true
      when: not dev_reset_controller_config.stat.exists

    - name: Disconnect the tracked dev controller WireGuard interface
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir | dirname }}/scripts/disconnect-wireguard.sh"
          - "{{ inventory_slug }}"
      become: true
      when: dev_reset_controller_config.stat.exists
