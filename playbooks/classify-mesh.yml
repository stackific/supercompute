---
# Classify static vs roaming and pick the WireGuard / rathole hub.
- name: Classify static vs roaming nodes and pick the static hub
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Reset classified WireGuard node lists
      ansible.builtin.set_fact:
        static_nodes: []
        roaming_nodes: []
        non_lima_roaming_nodes: []

    - name: Classify each WireGuard inventory node
      ansible.builtin.set_fact:
        static_nodes: >-
          {{
            static_nodes
            + ([] if (hostvars[item].roaming | default(false) | bool) else [item])
          }}
        roaming_nodes: >-
          {{
            roaming_nodes
            + ([item] if (hostvars[item].roaming | default(false) | bool) else [])
          }}
        non_lima_roaming_nodes: >-
          {{
            non_lima_roaming_nodes
            + (
              [item]
              if (
                (hostvars[item].roaming | default(false) | bool)
                and not (hostvars[item].node_lima_guest | default(false) | bool)
              )
              else []
            )
          }}
      loop: "{{ groups['nodes'] | sort }}"
      loop_control:
        label: "{{ item }}"

    - name: Record roaming presence and the static hub hostname
      ansible.builtin.set_fact:
        has_roaming: "{{ roaming_nodes | length > 0 }}"
        has_non_lima_roaming: "{{ non_lima_roaming_nodes | length > 0 }}"
        static_hub: "{{ static_nodes | first | default('') }}"

    - name: Expose the rathole hub as an in-memory group
      ansible.builtin.add_host:
        name: "{{ static_hub }}"
        groups: rathole_hub
      when:
        - has_non_lima_roaming | bool
        - static_hub | length > 0
