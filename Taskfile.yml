version: "3"

set: [errexit, nounset, pipefail]

includes:
  project:
    taskfile: ./taskfiles/project.yml
    flatten: true
  vault:
    taskfile: ./taskfiles/vault.yml
    flatten: true
  lima:
    taskfile: ./taskfiles/lima.yml
    flatten: true
  wireguard:
    taskfile: ./taskfiles/wireguard.yml
    flatten: true
  cluster:
    taskfile: ./taskfiles/cluster.yml
    flatten: true

tasks:
  default:
    desc: List available tasks and task-specific parameters
    silent: true
    cmds:
      - task --list
      - |
        printf '%s\n' \
          '' \
          'Task-specific parameters (environment-scoped tasks require ENV=<slug>):' \
          '  down           ENV=<slug> CONFIRM=down-<slug>' \
          '  env-reset      ENV=<slug> CONFIRM=reset-<slug>' \
          '  dev-reset      CONFIRM=reset-dev' \
          '  dev-reset-lima CONFIRM=reset-dev-lima' \
          '  lima-up        ENV=dev-lima (or other env with node_lima_guest hosts)' \
          '  ssh            NODE=<inventory_hostname>'
