---
- name: Stop and disable this server's WireGuard interface
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ cloud_wireguard_interface }}.service"
    enabled: false
    state: stopped
  become: true
  failed_when: false

- name: Remove this server's private WireGuard configuration
  ansible.builtin.file:
    path: "/etc/wireguard/{{ cloud_wireguard_interface }}.conf"
    state: absent
  become: true

- name: Remove hub IPv4 forwarding drop-in written by cloud_wireguard_node
  ansible.builtin.file:
    path: /etc/sysctl.d/99-scwg-forward.conf
    state: absent
  become: true
  when:
    - hostvars['localhost'].cloud_wireguard_roaming_nodes | default([]) | length > 0
    - inventory_hostname == (hostvars['localhost'].cloud_wireguard_hub | default(''))

- name: Remove hub WireGuard peer forwarding rule
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ cloud_wireguard_interface }}"
    out_interface: "{{ cloud_wireguard_interface }}"
    jump: ACCEPT
    state: absent
  become: true
  when:
    - hostvars['localhost'].cloud_wireguard_roaming_nodes | default([]) | length > 0
    - inventory_hostname == (hostvars['localhost'].cloud_wireguard_hub | default(''))
