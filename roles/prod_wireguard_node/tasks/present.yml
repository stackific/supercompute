---
- name: Require Ubuntu 26.04 with the declared host architecture before bootstrap
  ansible.builtin.assert:
    that:
      - node_ubuntu_version == '26.04'
      - node_ubuntu_codename == 'resolute'
      - >
          node_host_architecture == (
            'aarch64' if (node_lima_guest | default(false) | bool) else 'x86_64'
          )
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == node_ubuntu_version
      - ansible_facts['distribution_release'] == node_ubuntu_codename
      - ansible_facts['architecture'] == node_host_architecture
    fail_msg: >-
      Bootstrap requires Ubuntu {{ node_ubuntu_version }}
      ({{ node_ubuntu_codename }})
      {{ 'aarch64 (node_lima_guest)' if (node_lima_guest | default(false) | bool) else 'x86_64' }};
      {{ inventory_hostname }} declares {{ node_host_architecture | default('unknown') }}
      and reports
      {{ ansible_facts['distribution'] | default('unknown') }}
      {{ ansible_facts['distribution_version'] | default('unknown') }}
      {{ ansible_facts['distribution_release'] | default('unknown') }}
      {{ ansible_facts['architecture'] | default('unknown') }}.

- name: Require a WireGuard identity for this production server
  ansible.builtin.assert:
    that:
      - prod_wireguard_address is defined
      - prod_wireguard_address is string
      - prod_wireguard_address | length > 0
      - prod_wireguard_address != prod_wireguard_controller_address
      - vault_prod_wireguard_private_keys[inventory_hostname] is string
      - vault_prod_wireguard_public_keys[inventory_hostname] is string
      - vault_prod_wireguard_private_keys.macos is string
      - vault_prod_wireguard_public_keys.macos is string
      - >
        (wireguard_roaming | default(false) | bool)
        or (
          prod_wireguard_endpoint is string
          and prod_wireguard_endpoint | length > 0
          and prod_wireguard_endpoint is not match('^REPLACE_WITH_')
        )
      - >
        (not (wireguard_roaming | default(false) | bool))
        or (node_lima_guest | default(false) | bool)
        or (
          prod_bootstrap_ssh_host is string
          and prod_bootstrap_ssh_host | length > 0
          and prod_bootstrap_ssh_host is not match('^REPLACE_WITH_')
        )
      - >
        (not (node_lima_guest | default(false) | bool))
        or (
          (wireguard_roaming | default(false) | bool)
          and (
            prod_bootstrap_ssh_host is not defined
            or prod_bootstrap_ssh_host | length == 0
          )
          and (
            prod_wireguard_endpoint is not defined
            or prod_wireguard_endpoint | length == 0
          )
        )
    fail_msg: >-
      This server lacks hosts.yml prod_wireguard_address, a complete
      Vault-managed WireGuard identity, or the correct bootstrap dial target
      (prod_wireguard_endpoint for a static public host; Lima-local SSH for
      node_lima_guest; prod_bootstrap_ssh_host + Cloudflare for non-Lima roaming).
  no_log: true

- name: Require WireGuard material for every production server
  ansible.builtin.assert:
    that:
      - vault_prod_wireguard_private_keys[item] is string
      - vault_prod_wireguard_public_keys[item] is string
  loop: "{{ groups['wireguard_nodes'] }}"
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Install the pinned WireGuard package
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: "wireguard-tools={{ prod_wireguard_tools_version }}"
    state: present
    allow_downgrade: true
  become: true

- name: Load the kernel WireGuard module
  ansible.builtin.command:
    argv: [modprobe, wireguard]
  become: true
  changed_when: false

- name: Create the private WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true

- name: Render this production server's private WireGuard configuration
  ansible.builtin.template:
    src: scwg0.conf.j2
    dest: "/etc/wireguard/{{ prod_wireguard_interface }}.conf"
    owner: root
    group: root
    mode: '0600'
  register: prod_wireguard_node_config
  become: true
  no_log: true

- name: Persist IPv4 forwarding drop-in on the static hub
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-scwg-forward.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by prod_wireguard_node — Mac↔roaming via this hub.
      net.ipv4.ip_forward = 1
  become: true
  when:
    - hostvars['localhost'].prod_wireguard_roaming_nodes | default([]) | length > 0
    - inventory_hostname == (hostvars['localhost'].prod_wireguard_hub | default(''))

- name: Apply IPv4 forwarding on the static hub now
  ansible.builtin.command:
    argv: [sysctl, -w, net.ipv4.ip_forward=1]
  become: true
  register: prod_wireguard_hub_sysctl_apply
  changed_when: >-
    'net.ipv4.ip_forward = 1' in (prod_wireguard_hub_sysctl_apply.stdout | default(''))
  failed_when: prod_wireguard_hub_sysctl_apply.rc != 0
  when:
    - hostvars['localhost'].prod_wireguard_roaming_nodes | default([]) | length > 0
    - inventory_hostname == (hostvars['localhost'].prod_wireguard_hub | default(''))

- name: Enable and start this production server's WireGuard interface
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ prod_wireguard_interface }}.service"
    enabled: true
    state: "{{ 'restarted' if prod_wireguard_node_config.changed else 'started' }}"
  become: true
  when: >-
    not (
      (prod_node_mesh_reachable | default(false) | bool)
      and (prod_wireguard_node_config.changed | default(false) | bool)
    )

- name: Restart WireGuard without holding the mesh SSH session open
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ prod_wireguard_interface }}.service"
    enabled: true
    state: restarted
  become: true
  async: 45
  poll: 0
  ignore_unreachable: true
  when:
    - prod_node_mesh_reachable | default(false) | bool
    - prod_wireguard_node_config.changed | default(false) | bool

- name: Wait for SSH after restarting WireGuard over the mesh path
  ansible.builtin.wait_for_connection:
    delay: 3
    timeout: 90
  when:
    - prod_node_mesh_reachable | default(false) | bool
    - prod_wireguard_node_config.changed | default(false) | bool

- name: Sync live WireGuard peers from the rendered config
  ansible.builtin.shell:
    cmd: >-
      set -euo pipefail;
      wg-quick strip {{ prod_wireguard_interface | quote }}
      | wg syncconf {{ prod_wireguard_interface | quote }} /dev/stdin
  args:
    executable: /bin/bash
  become: true
  changed_when: true
  # The conf file can be unchanged while the running interface still lacks new
  # spoke AllowedIPs (e.g. after adding roaming-2). systemd "started" does not
  # reload AllowedIPs; syncconf does, without dropping mesh SSH.
  when: >-
    (hostvars['localhost'].prod_wireguard_roaming_nodes | default([]) | length) > 0

- name: Allow WireGuard peer forwarding on the static hub
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ prod_wireguard_interface }}"
    out_interface: "{{ prod_wireguard_interface }}"
    jump: ACCEPT
    action: insert
    state: present
  become: true
  when:
    - hostvars['localhost'].prod_wireguard_roaming_nodes | default([]) | length > 0
    - inventory_hostname == (hostvars['localhost'].prod_wireguard_hub | default(''))

- name: Require IPv4 forwarding on the static hub after WireGuard is up
  ansible.builtin.command:
    argv: [sysctl, -n, net.ipv4.ip_forward]
  register: prod_wireguard_hub_ip_forward
  changed_when: false
  failed_when: (prod_wireguard_hub_ip_forward.stdout | trim) != '1'
  when:
    - hostvars['localhost'].prod_wireguard_roaming_nodes | default([]) | length > 0
    - inventory_hostname == (hostvars['localhost'].prod_wireguard_hub | default(''))

- name: Have roaming nodes initiate WireGuard through the static hub toward the Mac
  ansible.builtin.command:
    argv:
      - ping
      - -c
      - "3"
      - -W
      - "2"
      - -I
      - "{{ prod_wireguard_interface }}"
      - "{{ prod_wireguard_controller_address }}"
  when: wireguard_roaming | default(false) | bool
  register: prod_wireguard_roaming_controller_ping
  changed_when: false
  failed_when: false

- name: Show this production server's WireGuard peers without private keys
  ansible.builtin.command:
    argv: [wg, show, "{{ prod_wireguard_interface }}"]
  become: true
  changed_when: false
