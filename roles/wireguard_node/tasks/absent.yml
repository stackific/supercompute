---
- name: Remove project config from this server
  ansible.builtin.include_role:
    name: supercompute_config
  vars:
    supercompute_config_lifecycle: absent

- name: Stop and disable this server's WireGuard interface
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}.service"
    enabled: false
    state: stopped
  become: true
  failed_when: false

- name: Remove this server's private WireGuard configuration
  ansible.builtin.file:
    path: "/etc/wireguard/{{ wireguard_interface }}.conf"
    state: absent
  become: true

- name: Remove hub IPv4 forwarding drop-in written by wireguard_node
  ansible.builtin.file:
    path: /etc/sysctl.d/99-scwg-forward.conf
    state: absent
  become: true
  when:
    - hostvars['localhost'].wireguard_roaming_nodes | default([]) | length > 0
    - inventory_hostname == (hostvars['localhost'].wireguard_hub | default(''))

- name: Remove hub WireGuard peer forwarding rule
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ wireguard_interface }}"
    out_interface: "{{ wireguard_interface }}"
    jump: ACCEPT
    state: absent
  become: true
  when:
    - hostvars['localhost'].wireguard_roaming_nodes | default([]) | length > 0
    - inventory_hostname == (hostvars['localhost'].wireguard_hub | default(''))
