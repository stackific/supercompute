---
- name: Remove project config from this server
  ansible.builtin.include_role:
    name: supercompute_config
  vars:
    supercompute_config_lifecycle: absent

- name: Stop and disable roaming dial timer
  ansible.builtin.systemd_service:
    name: supercompute-roaming-dial.timer
    enabled: false
    state: stopped
    daemon_reload: true
  become: true
  failed_when: false
  when: roaming | default(false) | bool

- name: Remove roaming dial helper units and script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /etc/systemd/system/supercompute-roaming-dial.timer
    - /etc/systemd/system/supercompute-roaming-dial.service
    - /usr/local/sbin/supercompute-roaming-dial
  when: roaming | default(false) | bool

- name: Stop and disable this server's WireGuard interface
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ node_interface }}.service"
    enabled: false
    state: stopped
  become: true
  failed_when: false

- name: Remove this server's private WireGuard configuration
  ansible.builtin.file:
    path: "/etc/wireguard/{{ node_interface }}.conf"
    state: absent
  become: true

- name: Remove IPv4 forwarding drop-in written by wireguard_node
  ansible.builtin.file:
    path: /etc/sysctl.d/99-scwg-forward.conf
    state: absent
  become: true
  when:
    - hostvars['localhost'].roaming_nodes | default([]) | length > 0
    - not (roaming | default(false) | bool)
    - >-
      (node_forward_on_all_statics | default(true) | bool)
      or inventory_hostname == (hostvars['localhost'].static_hub | default(''))

- name: Remove WireGuard peer forwarding rule on public static relays
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ node_interface }}"
    out_interface: "{{ node_interface }}"
    jump: ACCEPT
    state: absent
  become: true
  when:
    - hostvars['localhost'].roaming_nodes | default([]) | length > 0
    - not (roaming | default(false) | bool)
    - >-
      (node_forward_on_all_statics | default(true) | bool)
      or inventory_hostname == (hostvars['localhost'].static_hub | default(''))
