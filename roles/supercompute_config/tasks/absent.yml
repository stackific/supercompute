---
- name: Remove project config from this server
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ supercompute_config_path }}"
    - "{{ supercompute_public_endpoints_path }}"
    - "{{ supercompute_roaming_transit_path }}"

- name: Remove the supercompute configuration directory when empty
  ansible.builtin.file:
    path: "{{ supercompute_config_dir }}"
    state: absent
  become: true
