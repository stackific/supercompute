---
- name: Require project identity from inventory all.vars
  ansible.builtin.assert:
    that:
      - project is string
      - project | length > 0
      - sc_ns is string
      - sc_ns | length > 0
      - sc_ns is not search('REPLACE_WITH_')
      - sc_ns is not search('<')
      - "'.' in sc_ns"
      - sc_ns.split('.') | length >= 3
      - sc_api is string
      - sc_api | length > 0
      - sc_api is not search('REPLACE_WITH_')
      - sc_api is not search('<')
      - "'.' in sc_api"
      - sc_app is string
      - sc_app | length > 0
      - sc_app is not search('REPLACE_WITH_')
      - sc_app is not search('<')
      - "'.' in sc_app"
      - sc_apps is string
      - sc_apps | length > 0
      - sc_apps is not search('REPLACE_WITH_')
      - sc_apps is not search('<')
      - "'.' in sc_apps"
      - vault_database_url is string
      - vault_database_url | length > 0
      - vault_database_url is match('^postgres(ql)?://')
      - vault_database_url is not search('REPLACE_WITH_')
      - vault_database_url is not search('@HOST:5432/DATABASE')
      - vault_database_secret is string
      - vault_database_secret | length > 0
    fail_msg: >-
      inventories/{{ inventory_slug }}/hosts.yml all.vars must define project,
      sc_ns, sc_api, sc_app, and sc_apps before nodes can receive
      {{ supercompute_config_path }}. Those FQDNs are copied into that file.
      sc_ns must have a parent zone (for example ns.example.com) so Mac
      LaunchDaemon reverse-DNS can be derived from it.
      The encrypted vault must contain vault_database_url and
      vault_database_secret (set the URL with task vault-edit;
      run task up or task vault-init for the database secret).

- name: Require WireGuard mesh hosts for the node config file
  ansible.builtin.assert:
    that:
      - groups['nodes'] | length > 0
      - hostvars[item].private_address is defined
      - hostvars[item].private_address | string | length > 0
    fail_msg: >-
      Every nodes host must define private_address before
      {{ supercompute_config_path }} can list mesh hosts.
  loop: "{{ groups['nodes'] | sort }}"
  loop_control:
    label: "{{ item }}"

- name: Create the supercompute configuration directory
  ansible.builtin.file:
    path: "{{ supercompute_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install project hosts file on this server
  ansible.builtin.template:
    src: hosts.yml.j2
    dest: "{{ supercompute_config_path }}"
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true

- name: Install public static dial list for roaming Endpoint rotation
  ansible.builtin.template:
    src: public-endpoints.list.j2
    dest: "{{ supercompute_public_endpoints_path }}"
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true

- name: Build transit AllowedIPs for roaming dial helper
  ansible.builtin.set_fact:
    supercompute_roaming_transit_ips: >-
      {{
        (
          (
            hostvars['localhost'].roaming_nodes | default([])
            | difference([inventory_hostname])
            | map('extract', hostvars, 'private_address')
            | map('regex_replace', '^(.*)$', '\\1/32')
            | list
          )
          + (
            [node_controller_address ~ '/32']
            if (node_include_controller_peer | default(true) | bool) else []
          )
        )
        | unique
        | list
      }}
  when: roaming | default(false) | bool

- name: Install roaming transit AllowedIPs sidecar
  ansible.builtin.copy:
    dest: "{{ supercompute_roaming_transit_path }}"
    owner: root
    group: root
    mode: '0600'
    content: "{{ (supercompute_roaming_transit_ips | default([])) | join(',') }}\n"
  become: true
  when: roaming | default(false) | bool
