---
- name: Stage and replace {{ wireguard_controller_node_file.destination }}
  ansible.builtin.command:
    argv:
      - limactl
      - shell
      - "{{ node.name }}"
      - --
      - sudo
      - sh
      - -ceu
      - |
        destination=$1
        mode=$2
        temporary=$(mktemp "${destination}.deploy-cloud.XXXXXX")
        trap 'rm -f "${temporary}"' EXIT HUP INT TERM
        cat > "${temporary}"
        chmod "${mode}" "${temporary}"
        chown root:root "${temporary}"
        mv -f "${temporary}" "${destination}"
        trap - EXIT HUP INT TERM
      - deploy-cloud-install
      - "{{ wireguard_controller_node_file.destination }}"
      - "{{ wireguard_controller_node_file.mode }}"
    stdin: "{{ wireguard_controller_node_file.content }}"
  register: wireguard_controller_node_file_install
  until: wireguard_controller_node_file_install.rc == 0
  retries: 3
  delay: 1
  changed_when: false
  no_log: true
