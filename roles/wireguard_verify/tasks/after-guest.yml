- name: Require the WireGuard service
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, wg-quick@wg0.service]
  changed_when: false

- name: Require the WireGuard management firewall service
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, manual-wg-firewall.service]
  become: true
  changed_when: false

- name: Require the project nftables table
  ansible.builtin.command:
    argv: [nft, list, table, inet, manual_wireguard]
  become: true
  changed_when: false

- name: Read the installed firewall policy checksum
  ansible.builtin.command:
    argv: [sha256sum, /etc/wireguard/manual-wireguard-lockdown.nft]
  become: true
  register: wireguard_verify_installed_firewall_sha
  changed_when: false

- name: Require the exact tracked firewall policy
  ansible.builtin.assert:
    that:
      - >-
        wireguard_verify_installed_firewall_sha.stdout.split()[0]
        == (lookup('ansible.builtin.template', wireguard_firewall_source, rstrip=false) | hash('sha256'))
    fail_msg: "{{ inventory_hostname }} does not have the tracked firewall policy."

- name: Read the installed firewall startup gate checksum
  ansible.builtin.command:
    argv: [sha256sum, "{{ wireguard_firewall_wait_path }}"]
  become: true
  register: wireguard_verify_installed_firewall_wait_sha
  changed_when: false

- name: Require the exact tracked firewall startup gate
  ansible.builtin.assert:
    that:
      - >-
        wireguard_verify_installed_firewall_wait_sha.stdout.split()[0]
        == (lookup('ansible.builtin.file', wireguard_firewall_wait_source, rstrip=false) | hash('sha256'))
    fail_msg: "{{ inventory_hostname }} does not have the tracked firewall startup gate."

- name: Read the installed firewall unit checksum
  ansible.builtin.command:
    argv: [sha256sum, /etc/systemd/system/manual-wg-firewall.service]
  become: true
  register: wireguard_verify_installed_firewall_unit_sha
  changed_when: false

- name: Require the exact tracked firewall unit
  ansible.builtin.assert:
    that:
      - >-
        wireguard_verify_installed_firewall_unit_sha.stdout.split()[0]
        == (lookup('ansible.builtin.template', wireguard_firewall_unit_source, rstrip=false) | hash('sha256'))
    fail_msg: "{{ inventory_hostname }} does not have the tracked firewall unit."

- name: Read the Ubuntu release and architecture through WireGuard
  ansible.builtin.shell:
    cmd: >-
      . /etc/os-release &&
      printf '%s|%s|%s|' "$ID" "$VERSION_ID" "$VERSION_CODENAME" &&
      uname -m
    executable: /bin/sh
  register: wireguard_verify_guest_os_contract
  changed_when: false

- name: Require Ubuntu 26.04 Resolute on the expected architecture through WireGuard
  ansible.builtin.assert:
    that:
      - >-
        wireguard_verify_guest_os_contract.stdout | trim ==
        'ubuntu|' ~ node_ubuntu_version ~ '|' ~ node_ubuntu_codename ~ '|' ~ node_host_architecture
    fail_msg: >-
      {{ inventory_hostname }} is not Ubuntu {{ node_ubuntu_version }}
      ({{ node_ubuntu_codename }}) {{ node_host_architecture }}.

- name: Prove every VM-to-VM WireGuard path
  ansible.builtin.command:
    argv: [ping, -c, '1', -W, '2', "{{ peer.wg_address }}"]
  loop: "{{ lima_nodes | rejectattr('name', 'equalto', inventory_hostname) | list }}"
  loop_control:
    loop_var: peer
    label: "{{ inventory_hostname }} -> {{ peer.name }}"
  changed_when: false
