---
- name: Validate requested Lima lifecycle
  ansible.builtin.assert:
    that:
      - lima_lifecycle in ['present', 'status', 'verify', 'absent']
    fail_msg: "lima_lifecycle must be present, status, verify, or absent."

- name: Refuse retired Lima-as-platform inventories
  ansible.builtin.assert:
    that:
      - provider.platform != 'lima'
      - provider.platform != 'vps'
    fail_msg: >-
      provider.platform={{ provider.platform }} is refused. Declare
      provider.platform=public and mark guests with node_lima_guest: true.

- name: Require a public provider with Lima guest metadata
  ansible.builtin.assert:
    that:
      - provider.platform == 'public'
      - provider.mode == 'remote'
      - provider.image.distribution == 'ubuntu'
      - provider.image.release == node_ubuntu_version
      - provider.image.architecture == 'arm64'
      - provider.image.source is string
      - provider.image.source | length > 0
      - provider.resources.cpus | int >= 1
      - provider.resources.memory_gib | int >= 1
      - provider.resources.disk_gib | int >= 1
      - lima_version is string
      - lima_version | length > 0
      - lima_nodes | length > 0
      - wireguard_listen_port | int > 0
    fail_msg: >-
      Lima guest factory requires provider.platform=public with Ubuntu
      {{ node_ubuntu_version }} arm64 image, positive resources, and WireGuard
      UDP forward metadata on lima_nodes for node_lima_guest hosts.

- name: Require the supported controller platform
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Darwin'
      - ansible_facts.architecture == 'arm64'
    fail_msg: "Lima guest factory requires macOS on Apple Silicon."

- name: Require LIMA_HOME for the dedicated provider runtime
  ansible.builtin.assert:
    that:
      - lima_runtime_home is string
      - lima_runtime_home | length > 0
      - lima_runtime_home == lima_home_dir
    fail_msg: "LIMA_HOME must be exported to the dedicated provider Lima home."

- name: Locate Lima
  ansible.builtin.command:
    argv: [limactl, --version]
  register: lima_version_check
  changed_when: false

- name: Require the pinned Lima version
  ansible.builtin.assert:
    that:
      - lima_version_check.stdout is search('(^|\\s)' ~ lima_version ~ '(\\s|$)')
    fail_msg: >-
      Lima {{ lima_version }} is required; found
      {{ lima_version_check.stdout | default('unknown', true) }}.

- name: Record desired inventory Lima instance names
  ansible.builtin.set_fact:
    lima_desired_instance_names: "{{ lima_nodes | map(attribute='name') | list | sort }}"

- name: Record inventory hosts marked as Lima guests
  ansible.builtin.set_fact:
    lima_inventory_guest_names: "{{ lima_inventory_guest_names | default([]) + [item] }}"
  when: hostvars[item].node_lima_guest | default(false) | bool
  loop: "{{ groups['deployment'] | default([]) | sort }}"
  loop_control:
    label: "{{ item }}"

- name: Default Lima guest name list when no deployment hosts are marked
  ansible.builtin.set_fact:
    lima_inventory_guest_names: []
  when: lima_inventory_guest_names is not defined

- name: Require at least one node_lima_guest host for Lima mutation and verify
  ansible.builtin.assert:
    that:
      - lima_desired_instance_names | length > 0
      - lima_inventory_guest_names | length > 0
    fail_msg: >-
      Lima lifecycle needs at least one deployment host with
      node_lima_guest: true and a matching lima_nodes entry.
  when: lima_lifecycle != 'status'

- name: Require lima_nodes names to match node_lima_guest hosts
  ansible.builtin.assert:
    that:
      - lima_desired_instance_names | sort == (lima_inventory_guest_names | sort)
    fail_msg: >-
      lima_nodes names must exactly match deployment hosts with
      node_lima_guest: true (got lima_nodes={{ lima_desired_instance_names | join(', ') }};
      guests={{ lima_inventory_guest_names | join(', ') }}).
  when: lima_lifecycle != 'status'

- name: Inspect Lima instances in the dedicated provider home
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ project_root }}/scripts/lima_instances.py"
  register: lima_instance_list
  changed_when: false

- name: Record existing Lima instance snapshot
  ansible.builtin.set_fact:
    lima_instance_snapshot: "{{ lima_instance_list.stdout | from_json }}"
    lima_project_instance_names: "{{ (lima_instance_list.stdout | from_json).all_names }}"
    lima_project_instance_states: "{{ (lima_instance_list.stdout | from_json).states }}"

- name: Record missing inventory Lima instances
  ansible.builtin.set_fact:
    lima_missing_instance_names: >-
      {{ lima_desired_instance_names | difference(lima_project_instance_names) | sort }}

- name: Refuse foreign instances in the dedicated provider Lima home
  ansible.builtin.assert:
    that:
      - lima_project_instance_names | difference(lima_desired_instance_names) | length == 0
    fail_msg: >-
      The dedicated project Lima home contains instances that are not in the
      deployment inventory. No instance was started, changed, or deleted.
  when:
    - lima_lifecycle != 'status'
    - lima_desired_instance_names | length > 0

- name: Report Lima status without mutating state
  when: lima_lifecycle == 'status'
  block:
    - name: Show the provider Lima runtime home
      ansible.builtin.debug:
        msg: "Lima runtime home: {{ lima_home_dir }}"

    - name: Render Lima resource status table
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ project_root }}/scripts/lima_instances.py"
          - --table
          - --usage
          - "--inventory-hosts={{ lima_desired_instance_names | join(',') }}"
      register: lima_status_table
      changed_when: false

    - name: Display Lima resource status table
      ansible.builtin.debug:
        msg: "{{ lima_status_table.stdout.splitlines() }}"

- name: Verify exact running Lima membership
  when: lima_lifecycle == 'verify'
  block:
    - name: Require the Lima runtime home to exist during verify
      ansible.builtin.stat:
        path: "{{ lima_home_dir }}"
      register: lima_home_stat

    - name: Refuse verify when the Lima runtime home is missing
      ansible.builtin.assert:
        that:
          - lima_home_stat.stat.exists
          - lima_home_stat.stat.isdir
        fail_msg: >-
          Lima verify requires an existing provider home at {{ lima_home_dir }}.
          Run task lima-up first.

    - name: Require exact inventory membership
      ansible.builtin.assert:
        that:
          - lima_project_instance_names | sort == lima_desired_instance_names | sort
        fail_msg: >-
          Lima membership does not exactly match the deployment inventory.
          Missing: {{ lima_missing_instance_names | join(', ') }}.
          Extra:
          {{ lima_project_instance_names | difference(lima_desired_instance_names) | join(', ') }}.

    - name: Require every inventory Lima instance to be running
      ansible.builtin.assert:
        that:
          - lima_project_instance_states[item] == 'Running'
        fail_msg: >-
          Lima instance {{ item }} is
          {{ lima_project_instance_states[item] | default('absent') }}, expected Running.
      loop: "{{ lima_desired_instance_names }}"

    - name: Report verified Lima membership
      ansible.builtin.debug:
        msg: >-
          Verified running Lima membership under {{ lima_home_dir }}:
          {{ lima_desired_instance_names | join(', ') }}.

- name: Create or start inventory Lima instances
  when: lima_lifecycle == 'present'
  block:
    - name: Create the project-owned Lima home when creating VMs
      ansible.builtin.file:
        path: "{{ lima_home_dir }}"
        state: directory
        mode: "0700"
      when: lima_missing_instance_names | length > 0

    - name: Create the tracked Lima definition directory
      ansible.builtin.file:
        path: "{{ lima_state_dir }}"
        state: directory
        mode: "0700"

    - name: Observe free capacity for newly created Lima VMs
      ansible.builtin.command:
        argv: [df, -Pk, "{{ lima_home_dir }}"]
      register: lima_home_capacity
      changed_when: false
      when: lima_missing_instance_names | length > 0

    - name: Require free capacity for newly created Lima VMs
      ansible.builtin.assert:
        that:
          - lima_home_capacity.stdout_lines | length >= 2
          - >-
            (lima_home_capacity.stdout_lines[-1].split()[3] | int * 1024) >=
            (lima_missing_instance_names | length * (lima_minimum_free_bytes_per_node | int))
        fail_msg: >-
          The filesystem containing {{ lima_home_dir }} needs enough free space
          for {{ lima_missing_instance_names | length }} new
          {{ provider.resources.disk_gib }} GiB Lima disk(s).
      when: lima_missing_instance_names | length > 0

    - name: Render the tracked Lima definitions
      ansible.builtin.template:
        src: lima.yaml.j2
        dest: "{{ lima_state_dir }}/{{ item.name }}.yaml"
        mode: "0600"
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Validate the tracked Lima definitions
      ansible.builtin.command:
        argv:
          - limactl
          - validate
          - "{{ lima_state_dir }}/{{ item.name }}.yaml"
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Check host WireGuard UDP ports before creating Lima instances
      ansible.builtin.command:
        argv: [lsof, -nP, "-iUDP:{{ item.wg_host_port }}"]
      register: lima_wireguard_host_port_check
      failed_when: false
      changed_when: false
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}:{{ item.wg_host_port }}"
      when: item.name in lima_missing_instance_names

    - name: Refuse WireGuard host ports owned outside the Lima instance
      ansible.builtin.assert:
        that:
          - item.rc != 0
        fail_msg: >-
          Cannot create {{ item.item.name }} because UDP/{{ item.item.wg_host_port }}
          is already in use. Choose a free wg_host_port in the provider inventory.
          Current holder: {{ item.stdout | default('unknown', true) }}
      loop: "{{ lima_wireguard_host_port_check.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('unknown') }}"
      when: not (item.skipped | default(false))

    - name: Verify existing Lima instances match the tracked WireGuard forward contract
      ansible.builtin.command:
        argv:
          - limactl
          - template
          - yq
          - "{{ lima_home_dir }}/{{ item.name }}/lima.yaml"
          - >-
            .minimumLimaVersion == "{{ lima_version }}" and .vmType == "vz" and
            .arch == "aarch64" and .cpus == {{ provider.resources.cpus }} and
            .memory == "{{ provider.resources.memory_gib }}GiB" and
            .disk == "{{ provider.resources.disk_gib }}GiB" and
            (.networks | length) == 1 and .networks[0].lima == "user-v2" and
            .networks[0].macAddress == "{{ item.mac_address }}" and
            .ssh.localPort == {{ item.ssh_port }} and .containerd.system == false and
            .containerd.user == false and (.portForwards | length) == 2 and
            .portForwards[0].guestPort == {{ wireguard_listen_port }} and
            .portForwards[0].hostPort == {{ item.wg_host_port }} and
            .portForwards[0].hostIP == "127.0.0.1" and .portForwards[0].proto == "udp" and
            .portForwards[0].static != true and .portForwards[1].guestPortRange[0] == 1 and
            .portForwards[1].guestPortRange[1] == 65535 and .portForwards[1].proto == "any" and
            .portForwards[1].ignore == true and .message == "{{ lima_ownership_message }}"
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      register: lima_instance_contract
      changed_when: false
      when: item.name in lima_project_instance_names

    - name: Reject Lima instances that differ from the tracked definition
      ansible.builtin.assert:
        that:
          - item.stdout | trim == 'true'
        fail_msg: >-
          Existing Lima instance {{ item.item.name }} differs from the tracked
          contract (including UDP {{ wireguard_listen_port }} host forwards).
          Run task wg-remove PROVIDER={{ inventory_slug }} when WireGuard state
          exists, then task lima-destroy CONFIRM=destroy-lima-{{ inventory_slug }},
          task lima-up, and task up PROVIDER={{ inventory_slug }}.
      loop: "{{ lima_instance_contract.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not (item.skipped | default(false))

    - name: Create absent Lima instances from the tracked definition
      ansible.builtin.command:
        argv:
          - limactl
          - start
          - --tty=false
          - "--name={{ item.name }}"
          - "{{ lima_state_dir }}/{{ item.name }}.yaml"
      environment:
        LIMA_SSH_PORT_FORWARDER: "false"
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name in lima_missing_instance_names
      changed_when: true

    - name: Start stopped inventory Lima instances
      ansible.builtin.command:
        argv: [limactl, start, --tty=false, "{{ item.name }}"]
      environment:
        LIMA_SSH_PORT_FORWARDER: "false"
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.name in lima_project_instance_names
        - lima_project_instance_states[item.name] == 'Stopped'
      changed_when: true

    - name: Reinspect Lima after the owner action
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ project_root }}/scripts/lima_instances.py"
      register: lima_after_owner_action
      changed_when: false

    - name: Require exact running Lima membership after lima-up
      ansible.builtin.assert:
        that:
          - >-
            (lima_after_owner_action.stdout | from_json).all_names | sort ==
            lima_desired_instance_names | sort
          - >-
            (lima_after_owner_action.stdout | from_json).states.keys() | list | sort ==
            lima_desired_instance_names | sort
          - >-
            (lima_after_owner_action.stdout | from_json).states.values() |
            select('ne', 'Running') | list | length == 0
        fail_msg: >-
          Lima did not converge to the exact running inventory membership under
          {{ lima_home_dir }}.

    - name: Read guest OS contract from newly created instances
      ansible.builtin.command:
        argv:
          - limactl
          - shell
          - "{{ item.name }}"
          - --
          - sh
          - -c
          - >-
            . /etc/os-release &&
            printf '%s|%s|%s|' "$ID" "$VERSION_ID" "$VERSION_CODENAME" &&
            uname -m
      register: lima_guest_os_contract
      changed_when: false
      loop: "{{ lima_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name in lima_missing_instance_names

    - name: Require Ubuntu 26.04 Resolute inside every new guest
      ansible.builtin.assert:
        that:
          - >-
            item.stdout | trim ==
            'ubuntu|' ~ node_ubuntu_version ~ '|' ~ node_ubuntu_codename ~ '|'
            ~ hostvars[item.item.name].node_host_architecture
        fail_msg: >-
          {{ item.item.name }} is not Ubuntu {{ node_ubuntu_version }}
          ({{ node_ubuntu_codename }})
          {{ hostvars[item.item.name].node_host_architecture }}.
      loop: "{{ lima_guest_os_contract.results | default([]) }}"
      when: not (item.skipped | default(false))

    - name: Report Lima up convergence
      ansible.builtin.debug:
        msg: >-
          Lima instances running under {{ lima_home_dir }}:
          {{ lima_desired_instance_names | join(', ') }}.

- name: Destroy inventory Lima instances
  when: lima_lifecycle == 'absent'
  block:
    - name: Require destroy confirmation
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'CONFIRM') == ('destroy-lima-' ~ inventory_slug)
        fail_msg: "Re-run with CONFIRM=destroy-lima-{{ inventory_slug }}."

    - name: Check whether the Lima runtime home exists
      ansible.builtin.stat:
        path: "{{ lima_home_dir }}"
      register: lima_destroy_home

    - name: Report when the Lima runtime home is already absent
      ansible.builtin.debug:
        msg: "Lima runtime home already absent: {{ lima_home_dir }}"
      when: not lima_destroy_home.stat.exists

    - name: Delete every inventory Lima instance in the provider home
      ansible.builtin.command:
        argv: [limactl, delete, --force, --tty=false, "{{ item }}"]
      loop: "{{ lima_project_instance_names }}"
      when:
        - lima_destroy_home.stat.exists
        - lima_project_instance_names | length > 0
      changed_when: true

    - name: Reinspect Lima after destroy
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ project_root }}/scripts/lima_instances.py"
      register: lima_destroy_remaining
      changed_when: false
      when: lima_destroy_home.stat.exists

    - name: Require an empty provider Lima home after destroy
      ansible.builtin.assert:
        that:
          - (lima_destroy_remaining.stdout | from_json).all_names | length == 0
        fail_msg: "Lima instances remain after lima-destroy."
      when: lima_destroy_home.stat.exists

    - name: Remove tracked Lima definitions after destroy
      ansible.builtin.file:
        path: "{{ lima_state_dir }}"
        state: absent

    - name: Report Lima destroy completion
      ansible.builtin.debug:
        msg: "Lima instances destroyed under {{ lima_home_dir }}"
      when: lima_destroy_home.stat.exists
