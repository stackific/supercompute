- name: Require the private macOS WireGuard configuration for safe removal
  ansible.builtin.stat:
    path: "{{ wireguard_state_dir }}/wg.conf"
  register: wireguard_remove_macos_config

- name: Refuse removal without the recovery configuration
  ansible.builtin.assert:
    that:
      - wireguard_remove_macos_config.stat.exists
      - wireguard_remove_macos_config.stat.mode == '0600'
    fail_msg: >-
      Refusing to guess which interface to remove. Restore
      .state/{{ inventory_slug }}/wireguard/wg.conf from the Vault-backed
      project state first.

- name: Read controller interfaces before removal
  ansible.builtin.command:
    argv: [ifconfig]
  register: wireguard_remove_interfaces
  changed_when: false

- name: Restore the macOS WireGuard interface when needed for safe removal
  ansible.builtin.command:
    argv: [wg-quick, up, "{{ wireguard_state_dir }}/wg.conf"]
  become: true
  when: "'inet ' ~ wireguard_macos_address ~ ' ' not in wireguard_remove_interfaces.stdout"
  changed_when: true

- name: Remove each guest firewall and WireGuard interface through a safe transport
  ansible.builtin.include_tasks: remove-node.yml
  loop: "{{ lima_nodes }}"
  loop_control:
    loop_var: node
    label: "{{ node.name }}"

- name: Give scheduled guest WireGuard teardown time to complete
  ansible.builtin.pause:
    seconds: 5

- name: Read controller interfaces after guest removal
  ansible.builtin.command:
    argv: [ifconfig]
  register: wireguard_remove_interfaces_after
  changed_when: false

- name: Remove the macOS WireGuard interface
  ansible.builtin.command:
    argv: [wg-quick, down, "{{ wireguard_state_dir }}/wg.conf"]
  become: true
  when: "'inet ' ~ wireguard_macos_address ~ ' ' in wireguard_remove_interfaces_after.stdout"
  changed_when: true

- name: Wait for ordinary Lima access to return
  ansible.builtin.command:
    argv: [limactl, shell, "{{ item.name }}", --, 'true']
  register: wireguard_remove_lima_access_restored
  until: wireguard_remove_lima_access_restored.rc == 0
  retries: 30
  delay: 1
  changed_when: false
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove regenerated private WireGuard runtime files
  ansible.builtin.file:
    path: "{{ wireguard_state_dir }}"
    state: absent
