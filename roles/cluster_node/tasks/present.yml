---
- name: Install apt HTTPS prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - debian-keyring
      - debian-archive-keyring
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove packages that conflict with Docker Engine
  ansible.builtin.apt:
    name: "{{ cluster_docker_conflict_packages }}"
    state: absent
  failed_when: false

- name: Download gVisor archive signing key
  ansible.builtin.get_url:
    url: "{{ cluster_gvisor_key_url }}"
    dest: /tmp/gvisor-archive.key
    mode: "0644"

- name: Install gVisor keyring
  ansible.builtin.shell:
    cmd: >-
      gpg --dearmor --yes -o {{ cluster_gvisor_keyring_path | quote }}
      /tmp/gvisor-archive.key
      && chmod 0644 {{ cluster_gvisor_keyring_path | quote }}
    creates: "{{ cluster_gvisor_keyring_path }}"

- name: Install gVisor apt source list
  ansible.builtin.copy:
    dest: "{{ cluster_gvisor_list_path }}"
    mode: "0644"
    content: |
      {{ cluster_gvisor_repo_line }}

- name: Ensure Docker apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ cluster_docker_key_url }}"
    dest: "{{ cluster_docker_keyring_path }}"
    mode: "0644"

- name: Install Docker apt source (DEB822)
  ansible.builtin.copy:
    dest: "{{ cluster_docker_sources_path }}"
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ cluster_docker_suite }}
      Components: stable
      Architectures: {{ cluster_deb_architecture }}
      Signed-By: {{ cluster_docker_keyring_path }}

- name: Build cluster package list for this host
  ansible.builtin.set_fact:
    cluster_present_packages: >-
      {{
        [cluster_gvisor_package]
        + cluster_docker_packages
        + cluster_pdns_packages
      }}

- name: Install gVisor, Docker Engine, PowerDNS, and dig
  ansible.builtin.apt:
    name: "{{ cluster_present_packages }}"
    state: present
    update_cache: true

- name: Ensure PowerDNS drop-in directory exists
  ansible.builtin.file:
    path: "{{ cluster_pdns_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Bind PowerDNS to the mesh address only
  ansible.builtin.template:
    src: pdns-local.conf.j2
    dest: "{{ cluster_pdns_dropin_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart PowerDNS

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: "{{ cluster_docker_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start PowerDNS
  ansible.builtin.systemd:
    name: "{{ cluster_pdns_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Install Caddy
  ansible.builtin.apt:
    name: "{{ cluster_caddy_package }}"
    state: present

- name: Pull the latest application images
  ansible.builtin.command:
    argv: [docker, pull, "{{ item.image }}"]
  loop: "{{ cluster_app_containers }}"
  loop_control:
    label: "{{ item.image }}"

- name: Remove existing application containers
  ansible.builtin.command:
    argv: [docker, rm, -f, "{{ item.name }}"]
  loop: "{{ cluster_app_containers }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: Run application containers
  ansible.builtin.command:
    argv: "{{ _cluster_docker_run }}"
  vars:
    _cluster_docker_env: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for pair in (item.env | default({}) | dict2items) -%}
      {%- set ns.args = ns.args + ['-e', pair.key ~ '=' ~ pair.value] -%}
      {%- endfor -%}
      {{ ns.args }}
    _cluster_docker_run: >-
      {{
        [
          'docker',
          'run',
          '--detach',
          '--name',
          item.name,
          '--restart',
          'unless-stopped',
          '--publish',
          '127.0.0.1:' ~ (item.port | string) ~ ':' ~ (item.port | string)
        ]
        + (_cluster_docker_env | list)
        + [item.image]
      }}
  loop: "{{ cluster_app_containers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install Caddyfile for app and api reverse proxies
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ cluster_caddyfile_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Reload Caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: "{{ cluster_caddy_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply queued Caddy reload
  ansible.builtin.meta: flush_handlers

- name: Prove runsc is on PATH
  ansible.builtin.command:
    argv: [runsc, --version]
  changed_when: false

- name: Prove Docker Engine is running
  ansible.builtin.command:
    argv: [docker, version]
  changed_when: false

- name: Prove application containers are running
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{.State.Running}}' }}"
      - "{{ cluster_sc_container_name }}"
      - "{{ cluster_supercompute_container_name }}"
  register: cluster_containers_running
  changed_when: false
  failed_when: cluster_containers_running.stdout_lines | join(',') != 'true,true'

- name: Prove Caddy is running
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ cluster_caddy_service }}"]
  changed_when: false
