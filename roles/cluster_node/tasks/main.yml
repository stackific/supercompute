---
- name: Require a WireGuard mesh address for this host
  ansible.builtin.assert:
    that:
      - prod_wireguard_address is defined
      - prod_wireguard_address is string
      - prod_wireguard_address | length > 0
    fail_msg: >-
      cluster_node needs prod_wireguard_address on {{ inventory_hostname }}
      (PowerDNS listens on and answers with mesh addresses).

- name: Detect whether MaxMind GeoIP update is configured
  ansible.builtin.set_fact:
    cluster_geoip_enabled: >-
      {{
        deployment_vault is defined
        and deployment_vault.secrets is mapping
        and (deployment_vault.secrets.maxmind_account_id | default('') | string | length) > 0
        and (deployment_vault.secrets.maxmind_license_key | default('') | string | length) > 0
      }}
  when: cluster_lifecycle == 'present'

- name: Require static hub and at least one roaming host for GeoDNS
  ansible.builtin.assert:
    that:
      - cluster_static_hub_host in groups['deployment']
      - hostvars[cluster_static_hub_host].prod_wireguard_address is string
      - (groups['deployment'] | select('match', '^roaming-') | list | length) >= 1
    fail_msg: >-
      GeoDNS needs {{ cluster_static_hub_host }} and at least one roaming-* host
      in deployment (NA/SA answers randomly among all wireguard_roaming mesh IPs).
  when:
    - cluster_lifecycle == 'present'
    - cluster_geoip_enabled | default(false) | bool

- name: Require a public hostname for the authoritative DNS zone apex
  ansible.builtin.assert:
    that:
      - cluster_public_hostname is string
      - cluster_public_hostname | length > 0
      - cluster_pdns_zone == cluster_public_hostname
    fail_msg: >-
      Set cluster_public_hostname (default test-app.stackific.com). The PowerDNS
      zone apex must match so dig of that name hits GeoDNS.
  when: cluster_lifecycle == 'present'

- name: Apply cluster node lifecycle
  ansible.builtin.include_tasks: "{{ cluster_lifecycle }}.yml"
