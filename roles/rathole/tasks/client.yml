---
- name: Require the SHA-pinned rathole binary from task setup
  ansible.builtin.stat:
    path: "{{ rathole_vendor_binary }}"
  delegate_to: localhost
  become: false
  register: rathole_vendor_stat

- name: Fail clearly when rathole has not been fetched on the controller
  ansible.builtin.assert:
    that:
      - rathole_vendor_stat.stat.exists
      - rathole_vendor_stat.stat.isreg
    fail_msg: >-
      Missing {{ rathole_vendor_binary }}. Run task setup so Ansible can copy
      the SHA-pinned Linux amd64 binary.

- name: Require this host's rathole client token and Noise public key
  ansible.builtin.assert:
    that:
      - vault_rathole_noise_public_key is string
      - vault_rathole_noise_public_key | length > 0
      - vault_rathole_tokens[inventory_hostname] is string
      - vault_rathole_tokens[inventory_hostname] | length > 0
      - hostvars['localhost'].static_hub is string
      - hostvars['localhost'].static_hub | length > 0
  no_log: true

- name: Install the pinned rathole binary
  ansible.builtin.copy:
    src: "{{ rathole_vendor_binary }}"
    dest: "{{ rathole_install_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create the rathole configuration directory
  ansible.builtin.file:
    path: "{{ rathole_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Render the rathole client configuration
  ansible.builtin.template:
    src: client.toml.j2
    dest: "{{ rathole_config_dir }}/client.toml"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  register: rathole_client_config

- name: Install the rathole client unit
  ansible.builtin.template:
    src: rathole-client.service.j2
    dest: /etc/systemd/system/rathole-client.service
    owner: root
    group: root
    mode: "0644"
  become: true
  register: rathole_client_unit

- name: Enable and start the rathole client
  ansible.builtin.systemd_service:
    name: rathole-client.service
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if (rathole_client_config.changed or rathole_client_unit.changed) else 'started' }}"
  become: true
