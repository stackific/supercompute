- name: Update APT metadata through Lima | {{ node.name }}
  ansible.builtin.command:
    argv:
      - limactl
      - shell
      - "{{ node.name }}"
      - --
      - sudo
      - env
      - DEBIAN_FRONTEND=noninteractive
      - apt-get
      - update
  changed_when: false

- name: Install WireGuard and nftables through Lima | {{ node.name }}
  ansible.builtin.command:
    argv:
      - limactl
      - shell
      - "{{ node.name }}"
      - --
      - sudo
      - env
      - DEBIAN_FRONTEND=noninteractive
      - apt-get
      - install
      - --yes
      - wireguard-tools
      - nftables
  changed_when: false

- name: Create the WireGuard configuration directory on {{ node.name }}
  ansible.builtin.command:
    argv: [limactl, shell, "{{ node.name }}", --, sudo, install, -d, -m, '700', /etc/wireguard]
  changed_when: false

- name: Create the project helper directory on {{ node.name }}
  ansible.builtin.command:
    argv: [limactl, shell, "{{ node.name }}", --, sudo, install, -d, -m, '0755', /usr/local/libexec]
  changed_when: false

- name: Atomically install tracked bootstrap files on {{ node.name }}
  ansible.builtin.include_tasks: install-node-file.yml
  loop:
    - destination: /etc/wireguard/wg0.conf
      mode: '0600'
      content: "{{ lookup('ansible.builtin.file', wireguard_state_dir ~ '/rendered/' ~ node.name ~ '.conf') }}"
    - destination: /etc/wireguard/manual-wireguard-lockdown.nft
      mode: '0600'
      content: "{{ lookup('ansible.builtin.template', wireguard_firewall_source) }}"
    - destination: /etc/systemd/system/manual-wg-firewall.service
      mode: '0644'
      content: "{{ lookup('ansible.builtin.template', wireguard_firewall_unit_source) }}"
    - destination: "{{ wireguard_firewall_wait_path }}"
      mode: '0755'
      content: "{{ lookup('ansible.builtin.file', wireguard_firewall_wait_source) }}"
  loop_control:
    loop_var: wireguard_controller_node_file
    label: "{{ wireguard_controller_node_file.destination }}"
  no_log: true

- name: Disable stale firewall state before starting WireGuard | {{ node.name }}
  ansible.builtin.command:
    argv: [limactl, shell, "{{ node.name }}", --, sudo, systemctl, disable, --now, manual-wg-firewall.service]
  changed_when: false
  failed_when: false

- name: Remove stale project nftables table on {{ node.name }}
  ansible.builtin.command:
    argv: [limactl, shell, "{{ node.name }}", --, sudo, nft, delete, table, inet, manual_wireguard]
  changed_when: false
  failed_when: false

- name: Enable and start WireGuard on {{ node.name }}
  ansible.builtin.command:
    argv: [limactl, shell, "{{ node.name }}", --, sudo, systemctl, enable, --now, wg-quick@wg0.service]
  register: wireguard_controller_start_wg
  changed_when: false
  failed_when: false

- name: Collect WireGuard start failure details on {{ node.name }}
  ansible.builtin.command:
    argv:
      - limactl
      - shell
      - "{{ node.name }}"
      - --
      - sudo
      - journalctl
      - -u
      - wg-quick@wg0.service
      - -n
      - "40"
      - --no-pager
  register: wireguard_controller_start_wg_journal
  changed_when: false
  when: wireguard_controller_start_wg.rc != 0

- name: Require WireGuard to start on {{ node.name }}
  ansible.builtin.assert:
    that:
      - wireguard_controller_start_wg.rc == 0
    fail_msg: >-
      wg-quick@wg0 failed on {{ node.name }}.
      stderr: {{ wireguard_controller_start_wg.stderr | default('') }}.
      journal: {{ wireguard_controller_start_wg_journal.stdout | default('') }}.
