---
- name: Show macOS WireGuard status
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require a VPS provider for production WireGuard status
      ansible.builtin.assert:
        that:
          - provider.platform == 'vps'
        fail_msg: >-
          prod-wireguard-status requires provider.platform=vps for
          PROVIDER={{ inventory_slug }}.
  tasks:
    - name: Show macOS WireGuard peers
      ansible.builtin.command:
        argv: [wg, show]
      become: true
      changed_when: false

- name: Show production node WireGuard status
  hosts: wireguard_nodes
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Show node WireGuard peer state
      ansible.builtin.command:
        argv: [wg, show, "{{ prod_wireguard_interface }}"]
      become: true
      changed_when: false
