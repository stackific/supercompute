---
- name: Verify provider contracts on the controller
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Require a deployment namespace
      ansible.builtin.assert:
        that:
          - deployment_name is string
          - deployment_name is match('^[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?$')
          - inventory_slug is string
          - inventory_slug | length > 0
        fail_msg: "deployment.yml and inventory_slug must identify this provider run."

    - name: Verify Lima membership when the provider is Lima-backed
      when: provider.platform == 'lima'
      environment:
        LIMA_HOME: "{{ lima_runtime_home }}"
        LIMA_SSH_PORT_FORWARDER: "false"
      block:
        - name: Run Lima verify lifecycle
          ansible.builtin.include_role:
            name: lima
          vars:
            lima_lifecycle: verify

    - name: Check whether Lima WireGuard controller state exists
      ansible.builtin.stat:
        path: "{{ wireguard_state_dir }}/wg.conf"
      register: verify_wireguard_controller_config
      when:
        - provider.platform == 'lima'
        - wireguard_state_dir is defined

    - name: Verify Lima WireGuard controller acceptance when mesh state exists
      when:
        - provider.platform == 'lima'
        - verify_wireguard_controller_config.stat.exists | default(false)
      environment:
        LIMA_HOME: "{{ lima_runtime_home }}"
        LIMA_SSH_PORT_FORWARDER: "false"
      block:
        - name: Run WireGuard controller acceptance checks
          ansible.builtin.include_role:
            name: wireguard_verify
            tasks_from: after-controller

    - name: Report when Lima WireGuard verify is skipped
      ansible.builtin.debug:
        msg: >-
          WireGuard controller state is absent under
          {{ wireguard_state_dir | default('(undefined)') }}; skipped mesh verify.
          Run task wg-up PROVIDER={{ inventory_slug }} after lima-up when ready.
      when:
        - provider.platform == 'lima'
        - not (verify_wireguard_controller_config.stat.exists | default(false))

    - name: Check whether production WireGuard controller state exists
      ansible.builtin.stat:
        path: "{{ prod_wireguard_config_path }}"
      register: verify_prod_wireguard_config
      when:
        - provider.platform == 'vps'
        - prod_wireguard_config_path is defined

    - name: Require production known_hosts aliases when mesh state exists
      when:
        - provider.platform == 'vps'
        - verify_prod_wireguard_config.stat.exists | default(false)
      block:
        - name: Require the verified production known_hosts file
          ansible.builtin.stat:
            path: "{{ prod_known_hosts }}"
          register: verify_prod_known_hosts

        - name: Assert production known_hosts is present and private
          ansible.builtin.assert:
            that:
              - verify_prod_known_hosts.stat.exists
              - verify_prod_known_hosts.stat.mode == '0600'
            fail_msg: "Missing mode-0600 {{ prod_known_hosts }}; run task wg-up PROVIDER={{ inventory_slug }}."

        - name: Require each inventory host alias in known_hosts
          ansible.builtin.command:
            argv: [ssh-keygen, -F, "{{ item }}", -f, "{{ prod_known_hosts }}"]
          loop: "{{ groups['wireguard_nodes'] }}"
          loop_control:
            label: "{{ item }}"
          changed_when: false

        - name: Require the production controller mesh address
          ansible.builtin.command:
            argv: [ifconfig]
          register: verify_prod_interfaces
          changed_when: false

        - name: Assert the production controller mesh address is active
          ansible.builtin.assert:
            that:
              - "'inet ' ~ prod_wireguard_controller_address ~ ' ' in verify_prod_interfaces.stdout"
            fail_msg: >-
              {{ prod_wireguard_controller_address }} is not active; run task wg-up
              PROVIDER={{ inventory_slug }} or restore the launchd mesh.

    - name: Report when production WireGuard verify is skipped
      ansible.builtin.debug:
        msg: >-
          Production WireGuard config is absent under
          {{ prod_wireguard_config_path | default('(undefined)') }}; skipped mesh verify.
          Fill inventory placeholders, then run task wg-up PROVIDER={{ inventory_slug }}.
      when:
        - provider.platform == 'vps'
        - not (verify_prod_wireguard_config.stat.exists | default(false))
