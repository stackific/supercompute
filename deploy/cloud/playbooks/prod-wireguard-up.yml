---
- name: Configure the macOS controller side of the production WireGuard mesh
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Require a VPS provider for production WireGuard
      ansible.builtin.assert:
        that:
          - provider.platform == 'vps'
          - provider.mode == 'remote'
        fail_msg: >-
          prod-wireguard-up requires provider.platform=vps for
          PROVIDER={{ inventory_slug }}.
  roles:
    - prod_wireguard_controller

- name: Select the production node transport without assuming public SSH remains open
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Probe mesh SSH access to every production node
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].wireguard_node_address }}"
        port: "{{ hostvars[item].ansible_port | default(prod_default_ssh_port) }}"
        timeout: 3
        connect_timeout: 3
        state: started
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "macOS -> {{ item }} through WireGuard"
      register: prod_wireguard_mesh_ssh_probes
      failed_when: false
      changed_when: false

    - name: Record whether every production node is already reachable through WireGuard
      ansible.builtin.set_fact:
        prod_wireguard_mesh_ssh_ready: >-
          {{
            (
              prod_wireguard_mesh_ssh_probes.results
              | selectattr('state', 'defined')
              | selectattr('state', 'equalto', 'started')
              | list
              | length
            ) == (groups['wireguard_nodes'] | length)
          }}

    - name: Explain the selected production node transport
      ansible.builtin.debug:
        msg: >-
          {{
            prod_wireguard_mesh_ssh_ready | bool
            | ternary(
                'All nodes are reachable through WireGuard; reconciling them through mesh SSH.',
                'One or more nodes are not reachable through WireGuard; public TCP SSH is required for recovery bootstrap.'
              )
          }}

- name: Require reachable public SSH only when the production mesh needs recovery
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for direct public SSH access to every production node
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].prod_wireguard_endpoint }}"
        port: "{{ hostvars[item].ansible_port | default(prod_default_ssh_port) }}"
        timeout: 30
        connect_timeout: 5
        state: started
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "macOS -> {{ item }} public recovery SSH"
      when: not (prod_wireguard_mesh_ssh_ready | bool)

- name: Reconcile each production server through WireGuard or public recovery SSH
  hosts: wireguard_nodes
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    ansible_host: >-
      {{
        (hostvars['localhost'].prod_wireguard_mesh_ssh_ready | bool)
        | ternary(wireguard_node_address, prod_wireguard_endpoint)
      }}
  roles:
    - prod_wireguard_node

- name: Prove macOS can reach every production node through the mesh
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for WireGuard SSH access to each production node
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].wireguard_node_address }}"
        port: "{{ hostvars[item].ansible_port | default(prod_default_ssh_port) }}"
        timeout: 30
        connect_timeout: 5
        state: started
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "macOS -> {{ item }}"

- name: Prove every production server can reach every peer through the mesh
  hosts: wireguard_nodes
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Wait for WireGuard SSH access to each peer
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].wireguard_node_address }}"
        port: "{{ hostvars[item].ansible_port | default(prod_default_ssh_port) }}"
        timeout: 30
        connect_timeout: 5
        state: started
      loop: "{{ groups['wireguard_nodes'] | difference([inventory_hostname]) }}"
      loop_control:
        label: "{{ inventory_hostname }} -> {{ item }}"

    - name: Show the healthy production WireGuard interface without private keys
      ansible.builtin.command:
        argv: [wg, show, "{{ prod_wireguard_interface }}"]
      become: true
      changed_when: false
