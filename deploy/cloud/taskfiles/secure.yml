version: "3"

env:
  PROVIDER: "{{.PROVIDER}}"

tasks:
  secure-up:
    desc: Install, encrypt, and unlock /srv/secure when encryption_at_rest is true
    requires:
      vars: [PROVIDER]
    preconditions:
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running secure-up
    cmds:
      - uv run --locked python scripts/vault.py ensure-secure-storage
      - bash scripts/ansible-playbook.sh "{{.PROVIDER}}" --ask-become-pass playbooks/secure-up.yml

  secure-status:
    desc: Show /srv/secure encryption and unlock status on every node
    requires:
      vars: [PROVIDER]
    preconditions:
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running secure-status
    cmds:
      - bash scripts/ansible-playbook.sh "{{.PROVIDER}}" --ask-become-pass playbooks/secure-status.yml

  secure-syntax:
    internal: true
    desc: Syntax-check secure storage playbooks for a provider
    requires:
      vars: [PROVIDER]
    cmds:
      - bash scripts/ansible-playbook.sh "{{.PROVIDER}}" --syntax-check playbooks/secure-up.yml
      - bash scripts/ansible-playbook.sh "{{.PROVIDER}}" --syntax-check playbooks/secure-status.yml
