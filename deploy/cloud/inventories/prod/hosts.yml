---
# Production inventory: static-N VPS + optional roaming-N (add/remove hosts here).
# Before wg-up, also set prod_default_ssh_user (and prod_ssh_private_key_file)
# in group_vars/all/main.yml — see docs/setup-prod.md "Fill the production inventory".
#
# Per host required vars (wg-up syncs .state from this file):
#   Stable VPS:
#     prod_wireguard_endpoint       — public IPv4 or DNS (not the mesh address)
#     prod_ssh_host_ed25519_sha256  — SHA256:… of /etc/ssh/ssh_host_ed25519_key.pub
#     prod_wireguard_address        — unique mesh IP in prod_wireguard_network_cidr
#   Roaming (wireguard_roaming: true):
#     prod_bootstrap_ssh_host       — Cloudflare Tunnel SSH hostname
#     prod_ssh_host_ed25519_sha256
#     prod_wireguard_address
#     (do not set prod_wireguard_endpoint)
#
# Host-key fingerprint: from a verified first connect, e.g.
#   ssh-keyscan -t ed25519 203.0.113.10 | ssh-keygen -lf - -E sha256
all:
  children:
    controller:
      hosts:
        localhost:
          ansible_connection: local
    deployment:
      hosts:
        static-1:
          prod_wireguard_endpoint: "159.203.1.128"
          prod_ssh_host_ed25519_sha256: "SHA256:dnFNCY81/83iFfBlCtghmztGwsoTXw8kSnDEYPwP+sI"
          prod_wireguard_address: 10.217.79.11
        roaming-1:
          wireguard_roaming: true
          prod_bootstrap_ssh_host: "qnap-ubu26.tanzimsaqib.com"
          prod_ssh_host_ed25519_sha256: "SHA256:G+qliEefuCpZY9XZ2tyZT1gaGk9p5OMlRCrlFAih+c4"
          prod_wireguard_address: 10.217.79.12   # free address in 10.217.79.0/24
    wireguard_nodes:
      children:
        deployment: {}
