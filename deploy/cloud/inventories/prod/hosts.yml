---
# Production inventory: three Ubuntu 26.04 AMD64 VPS nodes.
# Replace every REPLACE_WITH_* value before running provider automation.
#
# Public endpoint examples (any one form is fine per node):
#   "203.0.113.10"
#   "node1.example.com"
#   "203.0.113.10:22"          # only if SSH is not on port 22; prefer ansible_port below
#
# Host-key fingerprint: from a verified first connect, e.g.
#   ssh-keyscan -t ed25519 203.0.113.10 | ssh-keygen -lf - -E sha256
# Record the SHA256:… line for ed25519 only.
all:
  children:
    controller:
      hosts:
        localhost:
          ansible_connection: local
    deployment:
      hosts:
        prod-1:
          # Public bootstrap address (DNS or IPv4). Used only until WireGuard is up.
          prod_wireguard_endpoint: "REPLACE_WITH_PUBLIC_ENDPOINT_1"
          # Example: "203.0.113.11" or "prod-1.example.com"
          prod_ssh_host_ed25519_sha256: "SHA256:REPLACE_WITH_COMPLETE_FINGERPRINT_1"
          # Example: "SHA256:AbCdEfGhIjKlMnOpQrStUvWxYz0123456789abcdefg"
        prod-2:
          prod_wireguard_endpoint: "REPLACE_WITH_PUBLIC_ENDPOINT_2"
          # Example: "203.0.113.12" or "prod-2.example.com"
          prod_ssh_host_ed25519_sha256: "SHA256:REPLACE_WITH_COMPLETE_FINGERPRINT_2"
        prod-3:
          prod_wireguard_endpoint: "REPLACE_WITH_PUBLIC_ENDPOINT_3"
          # Example: "203.0.113.13" or "prod-3.example.com"
          prod_ssh_host_ed25519_sha256: "SHA256:REPLACE_WITH_COMPLETE_FINGERPRINT_3"
    wireguard_nodes:
      children:
        deployment: {}
