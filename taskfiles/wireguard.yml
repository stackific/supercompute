version: "3"

env:
  ENV: "{{.ENV}}"

tasks:
  wg-status:
    desc: Show WireGuard mesh status for a provider
    requires:
      vars: [ENV]
    preconditions:
      - sh: command -v wg >/dev/null 2>&1
        msg: Install wireguard-tools (wg) before running wg-status
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running wg-status
    cmds:
      - |
        platform="$(uv run --locked python scripts/provider_platform.py --provider "{{.ENV}}")"
        case "${platform}" in
          public)
            bash scripts/ansible-playbook.sh "{{.ENV}}" --ask-become-pass playbooks/wireguard-status.yml
            ;;
          lima)
            echo "provider.platform=lima is refused; use provider.platform=public." >&2
            exit 2
            ;;
          vps)
            echo "provider.platform=vps is refused; rename to provider.platform=public." >&2
            exit 2
            ;;
          *)
            echo "ENV={{.ENV}} has unsupported provider.platform=${platform}." >&2
            exit 2
            ;;
        esac

  wg-remove:
    desc: Disconnect the Mac WireGuard controller only (leave nodes and cluster state)
    requires:
      vars: [ENV]
    preconditions:
      - sh: command -v wg >/dev/null 2>&1
        msg: Install wireguard-tools (wg) before running wg-remove
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running wg-remove
    cmds:
      - |
        platform="$(uv run --locked python scripts/provider_platform.py --provider "{{.ENV}}")"
        case "${platform}" in
          public)
            bash scripts/disconnect-wireguard.sh "{{.ENV}}"
            ;;
          lima)
            echo "provider.platform=lima is refused; use provider.platform=public." >&2
            exit 2
            ;;
          vps)
            echo "provider.platform=vps is refused; rename to provider.platform=public." >&2
            exit 2
            ;;
          *)
            echo "ENV={{.ENV}} has unsupported provider.platform=${platform}." >&2
            exit 2
            ;;
        esac

  ssh:
    desc: SSH to a node over WireGuard (NODE=<inventory_hostname>)
    requires:
      vars: [ENV, NODE]
    env:
      NODE: "{{.NODE}}"
    preconditions:
      - sh: command -v wg >/dev/null 2>&1
        msg: Install wireguard-tools (wg) before running ssh
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running ssh
    cmds:
      - bash scripts/wg-ssh.sh

  rathole-client-bootstrap:
    desc: Install rathole on the static hub and render a roaming VM install script
    requires:
      vars: [ENV, NODE]
    env:
      NODE: "{{.NODE}}"
    preconditions:
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running rathole-client-bootstrap
      - sh: test -x .vendor/rathole/rathole
        msg: Run task setup to fetch the SHA-pinned rathole binary
    cmds:
      - |
        uv run --locked python scripts/known-hosts.py \
          --inventory "inventories/{{.ENV}}/hosts.yml" \
          --known-hosts ".state/{{.ENV}}/known_hosts" \
          --reuse-existing \
          --skip-non-lima-roaming
        ENV="{{.ENV}}" uv run --locked python scripts/vault.py ensure-secrets
        bash scripts/ansible-playbook.sh "{{.ENV}}" --ask-become-pass playbooks/rathole-server.yml
        uv run --locked python scripts/rathole.py render-client --provider "{{.ENV}}" --node "{{.NODE}}"
        echo "Copy that install script to {{.NODE}} and run it as root, then prove jump SSH and task up."

  wg-syntax:
    internal: true
    desc: Syntax-check WireGuard playbooks for a provider
    requires:
      vars: [ENV]
    cmds:
      - |
        platform="$(uv run --locked python scripts/provider_platform.py --provider "{{.ENV}}")"
        case "${platform}" in
          public)
            bash scripts/ansible-playbook.sh "{{.ENV}}" --syntax-check playbooks/wireguard-up.yml
            bash scripts/ansible-playbook.sh "{{.ENV}}" --syntax-check playbooks/wireguard-down.yml
            bash scripts/ansible-playbook.sh "{{.ENV}}" --syntax-check playbooks/wireguard-status.yml
            bash scripts/ansible-playbook.sh "{{.ENV}}" --syntax-check playbooks/rathole-server.yml
            bash -n scripts/disconnect-wireguard.sh
            bash -n scripts/wg-ssh.sh
            ;;
          lima)
            echo "provider.platform=lima is refused; use provider.platform=public." >&2
            exit 2
            ;;
          vps)
            echo "provider.platform=vps is refused; rename to provider.platform=public." >&2
            exit 2
            ;;
          *)
            echo "ENV={{.ENV}} has unsupported provider.platform=${platform}." >&2
            exit 2
            ;;
        esac
