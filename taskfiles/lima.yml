version: "3"

env:
  PROVIDER: "{{.PROVIDER}}"

tasks:
  lima-up:
    desc: Create or start node_lima_guest VMs for a provider
    requires:
      vars: [PROVIDER]
    preconditions:
      - sh: command -v limactl >/dev/null 2>&1
        msg: Install Lima before running lima-up
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running lima-up
      - sh: command -v ssh-keyscan >/dev/null 2>&1
        msg: Install OpenSSH (ssh-keyscan) before running lima-up
    cmds:
      - bash scripts/ansible-playbook.sh "{{.PROVIDER}}" playbooks/lima-up.yml
      - uv run --locked python scripts/lima-host-fingerprints.py --provider "{{.PROVIDER}}"

  lima-host-fingerprints:
    desc: Capture node_lima_guest SSH host ED25519 fingerprints into hosts.yml
    requires:
      vars: [PROVIDER]
    preconditions:
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before capturing Lima host fingerprints
      - sh: command -v ssh-keyscan >/dev/null 2>&1
        msg: Install OpenSSH (ssh-keyscan) before capturing Lima host fingerprints
    cmds:
      - uv run --locked python scripts/lima-host-fingerprints.py --provider "{{.PROVIDER}}"

  lima-status:
    desc: Show provider Lima guest resource status without creating state
    requires:
      vars: [PROVIDER]
    preconditions:
      - sh: command -v limactl >/dev/null 2>&1
        msg: Install Lima before running lima-status
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running lima-status
    env:
      LIMA_RUNTIME_HOME_MODE: path
    cmds:
      - bash scripts/ansible-playbook.sh "{{.PROVIDER}}" playbooks/lima-status.yml

  lima-destroy:
    desc: Destroy node_lima_guest VMs for a provider
    requires:
      vars:
        - PROVIDER
        - CONFIRM
    env:
      CONFIRM: "{{.CONFIRM}}"
      LIMA_RUNTIME_HOME_MODE: path
    preconditions:
      - sh: command -v limactl >/dev/null 2>&1
        msg: Install Lima before running lima-destroy
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running lima-destroy
    cmds:
      - bash scripts/ansible-playbook.sh "{{.PROVIDER}}" playbooks/lima-destroy.yml
