version: "3"

env:
  ENV: "{{.ENV}}"

tasks:
  lima-up:
    desc: Create or start node_lima_guest VMs for an environment
    requires:
      vars: [ENV]
    preconditions:
      - sh: command -v limactl >/dev/null 2>&1
        msg: Install Lima before running lima-up
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running lima-up
      - sh: command -v ssh-keyscan >/dev/null 2>&1
        msg: Install OpenSSH (ssh-keyscan) before running lima-up
    cmds:
      - bash scripts/ansible-playbook.sh "{{.ENV}}" playbooks/lima-up.yml
      - uv run --locked python scripts/lima-host-fingerprints.py --provider "{{.ENV}}" --force

  lima-host-fingerprints:
    internal: true
    desc: Capture node_lima_guest SSH host ED25519 fingerprints into hosts.yml
    requires:
      vars: [ENV]
    preconditions:
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before capturing Lima host fingerprints
      - sh: command -v ssh-keyscan >/dev/null 2>&1
        msg: Install OpenSSH (ssh-keyscan) before capturing Lima host fingerprints
    cmds:
      - uv run --locked python scripts/lima-host-fingerprints.py --provider "{{.ENV}}"

  lima-status:
    desc: Show Lima guest resource status without creating state
    requires:
      vars: [ENV]
    preconditions:
      - sh: command -v limactl >/dev/null 2>&1
        msg: Install Lima before running lima-status
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running lima-status
    env:
      LIMA_RUNTIME_HOME_MODE: path
    cmds:
      - bash scripts/ansible-playbook.sh "{{.ENV}}" playbooks/lima-status.yml

  lima-destroy:
    internal: true
    desc: Destroy node_lima_guest VMs for an environment
    requires:
      vars:
        - ENV
        - CONFIRM
    env:
      CONFIRM: "{{.CONFIRM}}"
      LIMA_RUNTIME_HOME_MODE: ensure
    preconditions:
      - sh: command -v limactl >/dev/null 2>&1
        msg: Install Lima before running lima-destroy
      - sh: command -v uv >/dev/null 2>&1
        msg: Install uv before running lima-destroy
      - sh: test "{{.CONFIRM}}" = "destroy-lima-{{.ENV}}"
        msg: Set CONFIRM=destroy-lima-{{.ENV}} to destroy Lima guests
    cmds:
      - bash scripts/ansible-playbook.sh "{{.ENV}}" playbooks/lima-destroy.yml
