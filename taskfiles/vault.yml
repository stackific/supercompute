version: "3"

env:
  ENV: "{{.ENV}}"

tasks:
  vault-init:
    desc: Initialize a new provider vault and generated password
    requires:
      vars: [ENV]
    cmds:
      - uv run --locked python scripts/vault.py init

  vault-edit:
    desc: Edit, validate, and sync a provider vault
    requires:
      vars: [ENV]
    cmds:
      - uv run --locked python scripts/vault.py edit

  vault-destroy:
    internal: true
    desc: Delete a provider vault and its generated password
    requires:
      vars:
        - ENV
        - CONFIRM
    env:
      CONFIRM: "{{.CONFIRM}}"
    cmds:
      - uv run --locked python scripts/vault.py destroy

  vault-secrets-ensure:
    internal: true
    desc: Ensure WireGuard keys and vault_database_secret in the provider vault
    requires:
      vars: [ENV]
    cmds:
      - uv run --locked python scripts/vault.py ensure-secrets

  vault-wireguard-ensure:
    internal: true
    desc: Ensure WireGuard key pairs exist in the provider vault
    requires:
      vars: [ENV]
    cmds:
      - uv run --locked python scripts/vault.py ensure-wireguard
