---
- name: Validate the Garage lifecycle request
  ansible.builtin.assert:
    that:
      - garage_lifecycle in ['up', 'down', 'status', 'destroy']
    fail_msg: "garage_lifecycle must be up, down, status, or destroy."

- name: List the shared Lima profiles
  ansible.builtin.command:
    argv: [env, -u, LIMA_HOME, limactl, list, --quiet]
  register: garage_lima_profiles
  changed_when: false

- name: Require the shared default Lima profile for Garage startup
  ansible.builtin.assert:
    that:
      - garage_lima_profile in garage_lima_profiles.stdout_lines
    fail_msg: >-
      Lima's shared {{ garage_lima_profile }} profile is required for Garage.
      Create it with the normal Lima/Docker workflow; Docker Swarm never creates it.
  when: garage_lifecycle in ['up', 'down', 'status']

- name: Start the shared Lima profile without changing its definition
  ansible.builtin.command:
    argv: [env, -u, LIMA_HOME, limactl, start, --tty=false, "{{ garage_lima_profile }}"]
  when: garage_lima_profile in garage_lima_profiles.stdout_lines
  changed_when: true

- name: Resolve the shared Garage VM's user-v2 address from inside that VM
  ansible.builtin.command:
    argv:
      - env
      - -u
      - LIMA_HOME
      - limactl
      - shell
      - "{{ garage_lima_profile }}"
      - --
      - getent
      - ahostsv4
      - "{{ garage_s3_bind_hostname }}"
  register: garage_user_v2_lookup
  changed_when: false
  when:
    - garage_lifecycle == 'up'
    - garage_lima_profile in garage_lima_profiles.stdout_lines

- name: Require the shared Garage VM to attach to Lima user-v2
  ansible.builtin.assert:
    that:
      - garage_user_v2_lookup.rc == 0
      - garage_user_v2_lookup.stdout_lines | length > 0
      - garage_user_v2_lookup.stdout_lines[0].split() | length > 0
      - garage_user_v2_lookup.stdout_lines[0].split()[0] is match('^(?!127\\.)[0-9]{1,3}(?:\\.[0-9]{1,3}){3}$')
    fail_msg: >-
      The shared Lima {{ garage_lima_profile }} profile must attach to the
      user-v2 network so {{ garage_s3_bind_hostname }} resolves inside it.
      Add `networks: [lima: user-v2]` to that pre-existing profile, restart it,
      then rerun this command. Docker Swarm will not change the shared profile.
  when:
    - garage_lifecycle == 'up'
    - garage_lima_profile in garage_lima_profiles.stdout_lines

- name: Record the shared Garage VM's user-v2 address
  ansible.builtin.set_fact:
    garage_s3_agent_bind_address: "{{ garage_user_v2_lookup.stdout_lines[0].split()[0] }}"
  when:
    - garage_lifecycle == 'up'
    - garage_lima_profile in garage_lima_profiles.stdout_lines

- name: Require the host Docker client for the existing shared Lima profile
  ansible.builtin.command:
    argv: [docker, info]
  register: garage_docker_info
  changed_when: false
  when: garage_lima_profile in garage_lima_profiles.stdout_lines

- name: Remove recognized current and legacy managed Garage resources
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ project_root }}/scripts/garage-destroy-owned.py"
  when:
    - garage_lifecycle == 'destroy'
    - garage_lima_profile in garage_lima_profiles.stdout_lines
  register: garage_destroy_owned
  changed_when: "'CHANGED=1' in garage_destroy_owned.stdout"

- name: Create the project-owned rendered Garage state directory
  ansible.builtin.file:
    path: "{{ garage_state_dir }}"
    state: directory
    mode: '0700'
  when: garage_lifecycle == 'up'

- name: Render Garage's non-persistent runtime configuration
  ansible.builtin.template:
    src: garage.toml.j2
    dest: "{{ garage_config_path }}"
    mode: '0600'
  no_log: true
  when: garage_lifecycle == 'up'

- name: Calculate the rendered Garage configuration fingerprint
  ansible.builtin.command:
    argv: [shasum, -a, '256', "{{ garage_config_path }}"]
  register: garage_config_fingerprint_result
  changed_when: false
  no_log: true
  when: garage_lifecycle == 'up'

- name: Record the rendered Garage configuration fingerprint
  ansible.builtin.set_fact:
    garage_config_fingerprint: "{{ garage_config_fingerprint_result.stdout.split()[0] }}"
  no_log: true
  when: garage_lifecycle == 'up'

- name: Include the private user-v2 listener in the Garage runtime fingerprint
  ansible.builtin.set_fact:
    garage_runtime_fingerprint: >-
      {{ (
        garage_config_fingerprint
        ~ ':' ~ garage_s3_agent_bind_address
        ~ ':' ~ (garage_s3_host_port | string)
        ~ ':' ~ (garage_s3_container_port | string)
      ) | hash('sha256') }}
  when: garage_lifecycle == 'up'

- name: Inspect the named Garage container
  ansible.builtin.command:
    argv: [docker, container, inspect, "{{ garage_container }}"]
  register: garage_container_inspect
  failed_when: false
  changed_when: false
  when: garage_lima_profile in garage_lima_profiles.stdout_lines

- name: Decode the named Garage container
  ansible.builtin.set_fact:
    garage_container_spec: "{{ (garage_container_inspect.stdout | from_json) | first }}"
  when:
    - garage_lima_profile in garage_lima_profiles.stdout_lines
    - garage_container_inspect.rc == 0

- name: Refuse to replace a container that is not owned by Docker Swarm
  ansible.builtin.assert:
    that:
      - >-
        (garage_container_spec.Config.Labels | default({})).get(
          'com.stackific.docker-swarm.garage-managed', ''
        ) == 'true'
    fail_msg: >-
      {{ garage_container }} exists but is not the managed Docker Swarm Garage
      container. It will not be replaced or removed automatically.
  when:
    - garage_lima_profile in garage_lima_profiles.stdout_lines
    - garage_container_inspect.rc == 0

- name: Read active holders for the local Garage S3 port
  ansible.builtin.command:
    argv:
      - docker
      - container
      - ls
      - --filter
      - "publish={{ garage_s3_host_port }}"
      - --format
      - "{{ '{{' }}.Names{{ '}}' }}"
  register: garage_s3_port_holders
  changed_when: false
  when: garage_lifecycle == 'up'

- name: Require the local Garage S3 port to be project-owned or free
  ansible.builtin.assert:
    that:
      - garage_s3_port_holders.stdout_lines | difference([garage_container]) | length == 0
    fail_msg: >-
      TCP {{ garage_s3_host_port }} in Lima's shared {{ garage_lima_profile }}
      profile is already held by {{ garage_s3_port_holders.stdout_lines
      | difference([garage_container]) | join(', ') }}. Run the confirmed
      standalone task garage-destroy to remove recognized legacy managed
      Garage resources, or free the port before rerunning task garage-up.
  when: garage_lifecycle == 'up'

- name: Pull the immutable Garage image
  ansible.builtin.command:
    argv: [docker, pull, "{{ garage_image }}"]
  register: garage_image_pull
  changed_when: "'Downloaded newer image' in garage_image_pull.stdout"
  when: garage_lifecycle == 'up'

- name: Inspect the project Garage network
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ garage_network }}"]
  register: garage_network_inspect
  failed_when: false
  changed_when: false
  when: garage_lifecycle == 'up'

- name: Create the project Garage network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - --label
      - com.stackific.docker-swarm.garage-managed=true
      - "{{ garage_network }}"
  when:
    - garage_lifecycle == 'up'
    - garage_network_inspect.rc != 0
  changed_when: true

- name: Inspect the project Garage volumes
  ansible.builtin.command:
    argv: [docker, volume, inspect, "{{ item }}"]
  loop:
    - "{{ garage_metadata_volume }}"
    - "{{ garage_data_volume }}"
  loop_control:
    label: "{{ item }}"
  register: garage_volume_inspect
  failed_when: false
  changed_when: false
  when: garage_lifecycle == 'up'

- name: Create missing project Garage volumes
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - create
      - --label
      - com.stackific.docker-swarm.garage-managed=true
      - "{{ item.item }}"
  loop: "{{ garage_volume_inspect.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - garage_lifecycle == 'up'
    - item.rc != 0
  changed_when: true

- name: Remove the existing managed Garage container only when its configuration changed
  ansible.builtin.command:
    argv: [docker, container, rm, --force, "{{ garage_container }}"]
  when:
    - garage_lifecycle == 'up'
    - garage_container_inspect.rc == 0
    - >-
      (garage_container_spec.Config.Labels | default({})).get(
          'com.stackific.docker-swarm.garage-config-sha256', ''
        ) != garage_runtime_fingerprint
  changed_when: true

- name: Start the unchanged managed Garage container when it is stopped
  ansible.builtin.command:
    argv: [docker, container, start, "{{ garage_container }}"]
  when:
    - garage_lifecycle == 'up'
    - garage_container_inspect.rc == 0
    - >-
      (garage_container_spec.Config.Labels | default({})).get(
          'com.stackific.docker-swarm.garage-config-sha256', ''
        ) == garage_runtime_fingerprint
    - not (garage_container_spec.State.Running | bool)
  changed_when: true

- name: Start Garage with controller-loopback and VM-private user-v2 listeners
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --detach
      - --name
      - "{{ garage_container }}"
      - --restart=unless-stopped
      - --network
      - "{{ garage_network }}"
      - --publish
      - "127.0.0.1:{{ garage_s3_host_port }}:{{ garage_s3_container_port }}"
      - --publish
      - "{{ garage_s3_agent_bind_address }}:{{ garage_s3_host_port }}:{{ garage_s3_container_port }}"
      - --label
      - com.stackific.docker-swarm.garage-managed=true
      - --label
      - "com.stackific.docker-swarm.garage-config-sha256={{ garage_runtime_fingerprint }}"
      - --volume
      - "{{ garage_config_path }}:/etc/garage.toml:ro"
      - --volume
      - "{{ garage_metadata_volume }}:/var/lib/garage/metadata"
      - --volume
      - "{{ garage_data_volume }}:/var/lib/garage/data"
      - "{{ garage_image }}"
      - /garage
      - server
      - --single-node
  when:
    - garage_lifecycle == 'up'
    - >-
      garage_container_inspect.rc != 0 or
      (garage_container_spec.Config.Labels | default({})).get(
        'com.stackific.docker-swarm.garage-config-sha256', '') != garage_runtime_fingerprint
  changed_when: true

- name: Wait for the standalone Garage cluster
  ansible.builtin.command:
    argv: [docker, exec, "{{ garage_container }}", /garage, status]
  register: garage_status_after_start
  until: garage_status_after_start.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  when: garage_lifecycle == 'up'

- name: Check whether the Vault-generated S3 key is imported
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ garage_container }}"
      - /garage
      - key
      - info
      - "{{ vault_garage_access_key }}"
  register: garage_s3_key
  failed_when: false
  changed_when: false
  no_log: true
  when: garage_lifecycle == 'up'

- name: Import the Vault-generated S3 key after Garage is available
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ garage_container }}"
      - /garage
      - key
      - import
      - --yes
      - -n
      - docker-swarm-storage
      - "{{ vault_garage_access_key }}"
      - "{{ vault_garage_secret_key }}"
  no_log: true
  when:
    - garage_lifecycle == 'up'
    - garage_s3_key.rc != 0
  changed_when: true

- name: Check for the Docker Swarm backup bucket
  ansible.builtin.command:
    argv: [docker, exec, "{{ garage_container }}", /garage, bucket, info, "{{ garage_bucket }}"]
  register: garage_bucket_info
  failed_when: false
  changed_when: false
  when: garage_lifecycle == 'up'

- name: Create the Docker Swarm backup bucket
  ansible.builtin.command:
    argv: [docker, exec, "{{ garage_container }}", /garage, bucket, create, "{{ garage_bucket }}"]
  when:
    - garage_lifecycle == 'up'
    - garage_bucket_info.rc != 0
  changed_when: true

- name: Grant the Vault-generated key full access to the backup bucket
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ garage_container }}"
      - /garage
      - bucket
      - allow
      - --key
      - "{{ vault_garage_access_key }}"
      - --read
      - --write
      - --owner
      - "{{ garage_bucket }}"
  no_log: true
  when: garage_lifecycle == 'up'
  changed_when: true

- name: Stop the managed Garage container while preserving its data
  ansible.builtin.command:
    argv: [docker, container, rm, --force, "{{ garage_container }}"]
  when:
    - garage_lifecycle == 'down'
    - garage_lima_profile in garage_lima_profiles.stdout_lines
    - garage_container_inspect.rc == 0
  changed_when: true

- name: Report the managed standalone Garage status
  ansible.builtin.command:
    argv: [docker, exec, "{{ garage_container }}", /garage, status]
  register: garage_status
  changed_when: false
  when: garage_lifecycle == 'status'

- name: Remove the project-owned rendered Garage state
  ansible.builtin.file:
    path: "{{ garage_state_dir }}"
    state: absent
  when: garage_lifecycle == 'destroy'
