---
- name: Check for the project backup timer unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ swarm_backup_timer }}"
  register: swarm_backup_remove_timer_unit
  become: true

- name: Disable future backup runs before removal
  ansible.builtin.systemd_service:
    name: "{{ swarm_backup_timer }}"
    enabled: false
    state: stopped
  become: true
  when: swarm_backup_remove_timer_unit.stat.exists

- name: Check whether a cold backup is currently running
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ swarm_backup_service }}"]
  register: swarm_backup_remove_service_state
  failed_when: false
  changed_when: false
  become: true
  when: swarm_backup_remove_timer_unit.stat.exists

- name: Refuse to remove an in-progress cold backup
  ansible.builtin.assert:
    that:
      - swarm_backup_remove_service_state.stdout | default('inactive') != 'active'
      - swarm_backup_remove_service_state.stdout | default('inactive') != 'activating'
    fail_msg: >-
      {{ swarm_backup_service }} is running. Its timer is now disabled; wait
      for Docker and quorum recovery before retrying removal.

- name: Remove project-owned backup units and private runtime state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ swarm_backup_timer }}"
    - "/etc/systemd/system/{{ swarm_backup_service }}"
    - "{{ swarm_backup_config_path }}"
    - "{{ swarm_backup_runner_path }}"
    - "{{ swarm_backup_restic_install_dir }}"
    - "{{ swarm_backup_cache_dir }}"
    - "{{ swarm_backup_runtime_dir }}"
  register: swarm_backup_removed_files
  become: true

- name: Reload systemd after backup removal
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: swarm_backup_removed_files.changed
