---
- name: Require the exact labeled active-manager backup contract
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['wireguard_nodes']
      - deployment_name is string
      - deployment_name is match('^[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?$')
      - swarm_availability == 'active'
      - swarm_run_on_backup | bool
      - swarm_backup_timer_interval_seconds | int == 21600
      - swarm_backup_retention_days | int == 30
      - ansible_facts.architecture in swarm_backup_restic_artifacts
      - swarm_backup_s3_endpoint is string
      - swarm_backup_s3_endpoint | length > 0
      - swarm_backup_s3_endpoint is not search('REPLACE_WITH_')
      - swarm_backup_s3_endpoint is match('^https?://[^/?#]+$')
      - not (swarm_backup_s3_endpoint.endswith('/'))
      - not (swarm_backup_s3_endpoint is search('[?#]'))
      - not (swarm_backup_s3_require_https | bool) or swarm_backup_s3_endpoint.startswith('https://')
      - swarm_backup_s3_bucket is string
      - swarm_backup_s3_bucket is not search('REPLACE_WITH_')
      - swarm_backup_s3_bucket is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
      - swarm_backup_s3_region is string
      - swarm_backup_s3_region | length > 0
      - swarm_backup_s3_region is not search('REPLACE_WITH_')
      - swarm_backup_s3_bucket_lookup in ['auto', 'dns', 'path']
      - swarm_backup_s3_access_key is string
      - swarm_backup_s3_access_key | length > 0
      - swarm_backup_s3_access_key is not search('REPLACE_WITH_')
      - swarm_backup_s3_secret_key is string
      - swarm_backup_s3_secret_key | length > 0
      - swarm_backup_s3_secret_key is not search('REPLACE_WITH_')
      - swarm_backup_restic_password is string
      - swarm_backup_restic_password | length >= 32
      - swarm_backup_object_prefix.startswith(deployment_name ~ '/')
    fail_msg: >-
      Refusing to install the six-hour backup timer without exactly 30-day
      retention, the labeled active manager, and complete Vault-backed
      Restic/S3 state.
  no_log: true

- name: Select the architecture-specific pinned Restic artifact
  ansible.builtin.set_fact:
    swarm_backup_restic_artifact: "{{ swarm_backup_restic_artifacts[ansible_facts.architecture] }}"

- name: Create root-owned backup directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ swarm_backup_cache_dir }}"
      mode: '0755'
    - path: "{{ swarm_backup_restic_install_dir }}"
      mode: '0755'
    - path: "{{ swarm_backup_runtime_dir }}"
      mode: '0700'
    - path: "{{ swarm_backup_config_path | dirname }}"
      mode: '0755'
  become: true

- name: Check the installed Restic binary
  ansible.builtin.stat:
    path: "{{ swarm_backup_restic_binary }}"
  register: swarm_backup_restic_stat
  become: true

- name: Read the installed Restic version
  ansible.builtin.command:
    argv: ["{{ swarm_backup_restic_binary }}", version]
  register: swarm_backup_restic_existing_version
  failed_when: false
  changed_when: false
  when:
    - swarm_backup_restic_stat.stat.exists
    - swarm_backup_restic_stat.stat.isreg
    - swarm_backup_restic_stat.stat.executable

- name: Decide whether pinned Restic needs installation
  ansible.builtin.set_fact:
    swarm_backup_restic_install_required: >-
      {{ not swarm_backup_restic_stat.stat.exists or
         not swarm_backup_restic_stat.stat.isreg or
         not swarm_backup_restic_stat.stat.executable or
         (swarm_backup_restic_existing_version.rc | default(1)) != 0 or
         not (swarm_backup_restic_existing_version.stdout | default('') is
              search('restic ' ~ swarm_backup_restic_version ~ ' ')) }}

- name: Download the SHA256-pinned Restic artifact only when needed
  ansible.builtin.get_url:
    url: "{{ swarm_backup_restic_base_url }}/{{ swarm_backup_restic_artifact.filename }}"
    dest: "{{ swarm_backup_cache_dir }}/{{ swarm_backup_restic_artifact.filename }}"
    checksum: "sha256:{{ swarm_backup_restic_artifact.sha256 }}"
    owner: root
    group: root
    mode: '0644'
    timeout: 120
  become: true
  when: swarm_backup_restic_install_required

- name: Expand the verified Restic executable
  ansible.builtin.shell:
    cmd: >-
      set -o errexit -o nounset -o pipefail;
      bzip2 --decompress --stdout
      {{ (swarm_backup_cache_dir ~ '/' ~ swarm_backup_restic_artifact.filename) | quote }}
      > {{ (swarm_backup_restic_binary ~ '.new') | quote }}
    executable: /bin/bash
  become: true
  changed_when: true
  when: swarm_backup_restic_install_required

- name: Install the verified Restic executable atomically
  ansible.builtin.copy:
    src: "{{ swarm_backup_restic_binary }}.new"
    dest: "{{ swarm_backup_restic_binary }}"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  become: true
  when: swarm_backup_restic_install_required

- name: Remove the transient expanded Restic executable
  ansible.builtin.file:
    path: "{{ swarm_backup_restic_binary }}.new"
    state: absent
  become: true

- name: Require the exact pinned Restic version
  ansible.builtin.command:
    argv: ["{{ swarm_backup_restic_binary }}", version]
  register: swarm_backup_restic_version_result
  changed_when: false
  failed_when: >-
    swarm_backup_restic_version_result.rc != 0 or
    ('restic ' ~ swarm_backup_restic_version ~ ' ') not in swarm_backup_restic_version_result.stdout

- name: Install the root-owned cold-backup runner
  ansible.builtin.copy:
    src: swarm-backup-run
    dest: "{{ swarm_backup_runner_path }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Write the root-only Restic and S3 configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ swarm_backup_config_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  become: true

- name: Check whether the encrypted Restic repository exists
  ansible.builtin.command:
    argv:
      - "{{ swarm_backup_restic_binary }}"
      - -o
      - "s3.bucket-lookup={{ swarm_backup_s3_bucket_lookup }}"
      - -o
      - "s3.region={{ swarm_backup_s3_region }}"
      - cat
      - config
  environment:
    RESTIC_REPOSITORY: >-
      s3:{{ swarm_backup_s3_endpoint }}/{{ swarm_backup_s3_bucket }}/{{ swarm_backup_object_prefix }}
    RESTIC_PASSWORD: "{{ swarm_backup_restic_password }}"
    RESTIC_CACHE_DIR: "{{ swarm_backup_runtime_dir }}/cache"
    AWS_ACCESS_KEY_ID: "{{ swarm_backup_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ swarm_backup_s3_secret_key }}"
    AWS_DEFAULT_REGION: "{{ swarm_backup_s3_region }}"
  register: swarm_backup_repository_config
  failed_when: false
  changed_when: false
  no_log: true
  become: true

- name: Refuse ambiguous or inaccessible S3 repository state
  ansible.builtin.assert:
    that:
      - swarm_backup_repository_config.rc in [0, 10]
    fail_msg: >-
      The configured S3 repository is neither readable nor safely absent.
      Check the endpoint, bucket, region, lookup style, credentials, and Restic password.
  no_log: true

- name: Initialize the encrypted Restic repository once
  ansible.builtin.command:
    argv:
      - "{{ swarm_backup_restic_binary }}"
      - -o
      - "s3.bucket-lookup={{ swarm_backup_s3_bucket_lookup }}"
      - -o
      - "s3.region={{ swarm_backup_s3_region }}"
      - init
  environment:
    RESTIC_REPOSITORY: >-
      s3:{{ swarm_backup_s3_endpoint }}/{{ swarm_backup_s3_bucket }}/{{ swarm_backup_object_prefix }}
    RESTIC_PASSWORD: "{{ swarm_backup_restic_password }}"
    RESTIC_CACHE_DIR: "{{ swarm_backup_runtime_dir }}/cache"
    AWS_ACCESS_KEY_ID: "{{ swarm_backup_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ swarm_backup_s3_secret_key }}"
    AWS_DEFAULT_REGION: "{{ swarm_backup_s3_region }}"
  no_log: true
  become: true
  changed_when: true
  when: swarm_backup_repository_config.rc == 10

- name: Verify the encrypted Restic repository after reconciliation
  ansible.builtin.command:
    argv:
      - "{{ swarm_backup_restic_binary }}"
      - -o
      - "s3.bucket-lookup={{ swarm_backup_s3_bucket_lookup }}"
      - -o
      - "s3.region={{ swarm_backup_s3_region }}"
      - cat
      - config
  environment:
    RESTIC_REPOSITORY: >-
      s3:{{ swarm_backup_s3_endpoint }}/{{ swarm_backup_s3_bucket }}/{{ swarm_backup_object_prefix }}
    RESTIC_PASSWORD: "{{ swarm_backup_restic_password }}"
    RESTIC_CACHE_DIR: "{{ swarm_backup_runtime_dir }}/cache"
    AWS_ACCESS_KEY_ID: "{{ swarm_backup_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ swarm_backup_s3_secret_key }}"
    AWS_DEFAULT_REGION: "{{ swarm_backup_s3_region }}"
  changed_when: false
  no_log: true
  become: true

- name: Install the backup service and six-hour timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - src: swarm-backup.service.j2
      dest: "{{ swarm_backup_service }}"
    - src: swarm-backup.timer.j2
      dest: "{{ swarm_backup_timer }}"
  register: swarm_backup_units
  become: true

- name: Reload systemd after backup unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: swarm_backup_units.changed

- name: Enable the server-side six-hour backup schedule
  ansible.builtin.systemd_service:
    name: "{{ swarm_backup_timer }}"
    enabled: true
    state: "{{ 'restarted' if swarm_backup_units.changed else 'started' }}"
  become: true
