- name: Wait for WireGuard SSH access
  ansible.builtin.wait_for_connection:
    timeout: 30

- name: Render the tracked WireGuard management nftables policy
  ansible.builtin.template:
    src: "{{ wireguard_firewall_source }}"
    dest: /etc/wireguard/manual-wireguard-lockdown.nft
    owner: root
    group: root
    mode: '0600'
  become: true

- name: Install the WireGuard management firewall systemd unit
  ansible.builtin.template:
    src: "{{ wireguard_firewall_unit_source }}"
    dest: /etc/systemd/system/manual-wg-firewall.service
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Create the local firewall helper directory
  ansible.builtin.file:
    path: "{{ wireguard_firewall_wait_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install the bounded Lima startup gate
  ansible.builtin.copy:
    src: "{{ wireguard_firewall_wait_source }}"
    dest: "{{ wireguard_firewall_wait_path }}"
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Validate the nftables policy before activation
  ansible.builtin.command:
    argv: [nft, --check, --file, /etc/wireguard/manual-wireguard-lockdown.nft]
  become: true
  changed_when: false

- name: Enable and restart the WireGuard management firewall
  ansible.builtin.systemd_service:
    name: manual-wg-firewall.service
    enabled: true
    state: restarted
    daemon_reload: true
  become: true

- name: Wait for the fail-closed WireGuard policy after service restart
  ansible.builtin.command:
    argv: [nft, list, table, inet, manual_wireguard]
  register: wireguard_lockdown_active_policy
  until: wireguard_lockdown_active_policy.rc == 0
  retries: 30
  delay: 1
  become: true
  changed_when: false
