---
- name: Require a supported gVisor lifecycle state
  ansible.builtin.assert:
    that:
      - swarm_gvisor_state in ['present', 'absent']
    fail_msg: "swarm_gvisor_state must be present or absent."

- name: Apply the requested gVisor lifecycle state
  ansible.builtin.include_tasks: "{{ swarm_gvisor_state }}.yml"
