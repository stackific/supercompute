---
swarm_gvisor_state: present
swarm_gvisor_release: '20260810.0'
swarm_gvisor_base_url: https://storage.googleapis.com/gvisor/releases/release
swarm_gvisor_install_dir: /usr/local/lib/docker-swarm-gvisor
swarm_gvisor_cache_dir: /var/cache/docker-swarm/gvisor
swarm_gvisor_daemon_config_path: /etc/docker/daemon.json
swarm_gvisor_verify_image: docker.io/library/alpine:3.23.5@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
swarm_gvisor_required_components:
  - runsc
  - containerd-shim-runsc-v1
  - gvisor-bin/checkpointgofer
  - gvisor-bin/gvisor_sentry
  - gvisor-bin/runsc-metric-server
swarm_gvisor_artifacts:
  x86_64:
    filename: gvisor-20260810.0-x86_64.tar.bz2
    sha512: 3de91138cda15682c11807387f6ecad9e7c8932262018a2813277e1b4efa03efe33b0a948e148c6b1ccfe7345bfab5d5e0d072519505465751273898bae19c62
  aarch64:
    filename: gvisor-20260810.0-aarch64.tar.bz2
    sha512: dc21bdc7a4f52d049f4da74a337fc7437b2ac1465c7479816a852120a8cff5292d72ae78bc4c581f857836bc9a56a1ba18ad687e6bef13d03fdd670d6f2071f7
swarm_gvisor_docker_config:
  default-runtime: runsc
  runtimes:
    runsc:
      path: "{{ swarm_gvisor_install_dir }}/runsc"
      runtimeArgs:
        - --network=sandbox
# Exact project-owned daemon configuration from before netstack was explicit.
# It is accepted only as a one-way migration source to the configuration above.
swarm_gvisor_legacy_docker_configs:
  - default-runtime: runsc
    runtimes:
      runsc:
        path: "{{ swarm_gvisor_install_dir }}/runsc"
