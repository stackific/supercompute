- name: Validate requested Lima lifecycle
  ansible.builtin.assert:
    that:
      - lima_lifecycle in ['present', 'verify', 'absent']
    fail_msg: "lima_lifecycle must be present, verify, or absent."

- name: Validate the immutable Ubuntu 26.04 ARM64 image contract
  ansible.builtin.assert:
    that:
      - node_ubuntu_version == '26.04'
      - node_ubuntu_codename == 'resolute'
      - node_host_architecture == 'aarch64'
      - >-
        lima_image_url is match(
          '^https://cloud-images\.ubuntu\.com/releases/resolute/release-[0-9]{8}/ubuntu-26\.04-server-cloudimg-arm64\.img$'
        )
      - lima_image_digest is match('^sha256:[a-f0-9]{64}$')
    fail_msg: >-
      Local requires an immutable, checksummed Ubuntu 26.04 (Resolute) ARM64
      release image and matching Ansible/APT architectures.
  when: lima_lifecycle != 'absent'

- name: Require the supported controller platform
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Darwin'
      - ansible_facts.architecture == 'arm64'
    fail_msg: "templ-local requires macOS on Apple Silicon."

- name: Locate Lima
  ansible.builtin.command:
    argv: [limactl, --version]
  register: lima_version_check
  changed_when: false

- name: Require the pinned Lima version
  ansible.builtin.assert:
    that:
      - lima_version_check.stdout is search('(^|\\s)' ~ lima_version ~ '(\\s|$)')
    fail_msg: >-
      Lima {{ lima_version }} is required; found
      {{ lima_version_check.stdout | default('unknown', true) }}.

- name: Create the project-owned Lima runtime directory
  ansible.builtin.file:
    path: "{{ lima_state_dir }}"
    state: directory
    mode: '0700'
  when: lima_lifecycle != 'absent'

- name: Create the project-owned Lima home
  ansible.builtin.file:
    path: "{{ lima_home_dir }}"
    state: directory
    mode: '0700'
  when: lima_lifecycle != 'absent'

- name: Render the pinned Lima definitions
  ansible.builtin.template:
    src: lima.yaml.j2
    dest: "{{ lima_state_dir }}/{{ item.name }}.yaml"
    mode: '0600'
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: lima_lifecycle != 'absent'

- name: Validate the tracked Lima definitions
  ansible.builtin.command:
    argv:
      - limactl
      - validate
      - "{{ lima_state_dir }}/{{ item.name }}.yaml"
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  when: lima_lifecycle != 'absent'

- name: List existing Lima instances
  ansible.builtin.command:
    argv: [limactl, list, --quiet]
  register: lima_instance_list
  changed_when: false

- name: Record existing Lima instance names
  ansible.builtin.set_fact:
    lima_instance_names: "{{ lima_instance_list.stdout_lines }}"

- name: Check host WireGuard UDP ports before creating Lima instances
  ansible.builtin.command:
    argv: [lsof, -nP, "-iUDP:{{ item.wg_host_port }}"]
  register: lima_wireguard_host_port_check
  failed_when: false
  changed_when: false
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}:{{ item.wg_host_port }}"
  when:
    - lima_lifecycle == 'present'
    - item.name not in lima_instance_names

- name: Refuse WireGuard host ports owned outside the Lima instance
  ansible.builtin.assert:
    that:
      - item.rc != 0
    fail_msg: >-
      Cannot create {{ item.item.name }} because UDP/{{ item.item.wg_host_port }}
      is already in use. Choose a free wg_host_port in the templ-local inventory.
      Current holder: {{ item.stdout | default('unknown', true) }}
  loop: "{{ lima_wireguard_host_port_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when: not (item.skipped | default(false))

- name: Verify existing Lima instances match the tracked contract
  ansible.builtin.command:
    argv:
      - limactl
      - template
      - yq
      - "{{ lima_home_dir }}/{{ item.name }}/lima.yaml"
      - >-
        .minimumLimaVersion == "{{ lima_version }}" and .vmType == "vz" and
        .arch == "aarch64" and .cpus == 2 and .memory == "2GiB" and
        .disk == "10GiB" and .images[0].location == "{{ lima_image_url }}" and
        .images[0].digest == "{{ lima_image_digest }}" and
        (.networks | length) == 1 and .networks[0].lima == "user-v2" and
        .networks[0].macAddress == "{{ item.mac_address }}" and
        .param.internal_netplanOptional == "true" and
        .ssh.localPort == {{ item.ssh_port }} and .containerd.system == false and
        .containerd.user == false and (.portForwards | length) == 2 and
        .portForwards[0].guestPort == {{ wireguard_listen_port }} and .portForwards[0].hostPort == {{ item.wg_host_port }} and
        .portForwards[0].hostIP == "127.0.0.1" and .portForwards[0].proto == "udp" and
        .portForwards[0].static != true and .portForwards[1].guestPortRange[0] == 1 and
        .portForwards[1].guestPortRange[1] == 65535 and .portForwards[1].proto == "any" and
        .portForwards[1].ignore == true and .message == "docker-swarm owned template-local VM"
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: lima_instance_contract
  changed_when: false
  when:
    - lima_lifecycle != 'absent'
    - item.name in lima_instance_names

- name: Reject Lima instances that differ from the tracked definition
  ansible.builtin.assert:
    that:
      - item.stdout | trim == 'true'
    fail_msg: >-
      Existing Lima instance {{ item.item.name }} differs from the templ-local contract.
      While the existing VMs are still available, run `task wg-remove
      PROVIDER=templ-local` if .state/templ-local/wireguard/wg.conf exists, then
      `task lima-destroy CONFIRM=destroy-templ-local`, `task lima-up`, and
      `task wg-up PROVIDER=templ-local`.
  loop: "{{ lima_instance_contract.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not (item.skipped | default(false))

- name: Create absent Lima instances
  ansible.builtin.command:
    argv:
      - limactl
      - start
      - --tty=false
      - "--name={{ item.name }}"
      - "{{ lima_state_dir }}/{{ item.name }}.yaml"
  environment:
    LIMA_SSH_PORT_FORWARDER: "false"
  changed_when: true
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - lima_lifecycle == 'present'
    - item.name not in lima_instance_names

- name: Start tracked existing Lima instances
  ansible.builtin.command:
    argv: [limactl, start, --tty=false, "{{ item.name }}"]
  environment:
    LIMA_SSH_PORT_FORWARDER: "false"
  changed_when: true
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - lima_lifecycle == 'present'
    - item.name in lima_instance_names

- name: Check whether controller WireGuard state already exists
  ansible.builtin.stat:
    path: "{{ wireguard_state_dir }}/wg.conf"
  register: lima_existing_controller_wireguard_config
  when: lima_lifecycle == 'present'

- name: Wait for each pre-existing Lima WireGuard UDP forward
  ansible.builtin.command:
    argv: [lsof, -nP, -a, -c, limactl, "-iUDP:{{ item.wg_host_port }}"]
  register: lima_wireguard_udp_forward
  until: lima_wireguard_udp_forward.rc == 0
  retries: 60
  delay: 1
  changed_when: false
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}:{{ item.wg_host_port }}"
  when:
    - lima_lifecycle == 'present'
    - item.name in lima_instance_names
    - lima_existing_controller_wireguard_config.stat.exists

- name: Read the actual Ubuntu release and architecture from each new template-local guest
  ansible.builtin.command:
    argv:
      - limactl
      - shell
      - "{{ item.name }}"
      - --
      - sh
      - -c
      - >-
        . /etc/os-release &&
        printf '%s|%s|%s|' "$ID" "$VERSION_ID" "$VERSION_CODENAME" &&
        uname -m
  register: lima_guest_os_contract
  changed_when: false
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - lima_lifecycle == 'present'
    - item.name not in lima_instance_names

- name: Require Ubuntu 26.04 Resolute ARM64 inside every new template-local guest
  ansible.builtin.assert:
    that:
      - >-
        item.stdout | trim ==
        'ubuntu|' ~ node_ubuntu_version ~ '|' ~ node_ubuntu_codename ~ '|' ~ node_host_architecture
    fail_msg: >-
      {{ item.item.name }} is not Ubuntu {{ node_ubuntu_version }}
      ({{ node_ubuntu_codename }}) {{ node_host_architecture }}. Replace the VM
      with the documented conditional wg-remove, lima-destroy, lima-up, and
      wg-up sequence.
  loop: "{{ lima_guest_os_contract.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - lima_lifecycle == 'present'
    - not (item.skipped | default(false))

- name: Create a project-local recovery directory for Lima credentials
  ansible.builtin.file:
    path: "{{ lima_recovery_dir }}"
    state: directory
    mode: '0700'
  when: lima_lifecycle == 'present'

- name: Check for Lima's generated SSH identity
  ansible.builtin.stat:
    path: "{{ lima_home_dir }}/_config/{{ item }}"
  register: lima_recovery_identity
  loop: [user, user.pub]
  loop_control:
    label: "{{ item }}"
  when: lima_lifecycle == 'present'

- name: Keep a project-local recovery copy of Lima's SSH identity
  ansible.builtin.copy:
    src: "{{ lima_home_dir }}/_config/{{ item.item }}"
    dest: "{{ lima_recovery_dir }}/{{ item.item }}"
    remote_src: true
    mode: "{{ '0600' if item.item == 'user' else '0644' }}"
  loop: "{{ lima_recovery_identity.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown') }}"
  when:
    - lima_lifecycle == 'present'
    - item.stat.exists | default(false)

- name: Delete template-local Lima instances and their VM disks
  ansible.builtin.command:
    argv: [limactl, delete, --force, --tty=false, "{{ item.name }}"]
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when:
    - lima_lifecycle == 'absent'
    - item.name in lima_instance_names
