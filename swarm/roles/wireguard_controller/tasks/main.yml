- name: Require macOS on Apple Silicon for WireGuard control
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Darwin'
      - ansible_facts.architecture == 'arm64'
    fail_msg: "templ-local WireGuard requires macOS on Apple Silicon."

- name: Require WireGuard tools on the controller
  ansible.builtin.command:
    argv: [which, "{{ item }}"]
  loop: [wg, wg-quick]
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: Require the controller utilities used for acceptance checks
  ansible.builtin.command:
    argv: [which, "{{ item }}"]
  loop: [lsof, ssh]
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: Verify the pinned Lima profiles
  ansible.builtin.include_role:
    name: lima
  vars:
    lima_lifecycle: verify

- name: Check for an existing private macOS WireGuard configuration
  ansible.builtin.stat:
    path: "{{ wireguard_state_dir }}/wg.conf"
  register: wireguard_controller_existing_macos_wireguard_config

- name: Wait for existing Lima WireGuard UDP forwards before controller recovery
  ansible.builtin.command:
    argv: [lsof, -nP, -a, -c, limactl, "-iUDP:{{ item.wg_host_port }}"]
  register: wireguard_controller_existing_lima_udp_forward
  until: wireguard_controller_existing_lima_udp_forward.rc == 0
  retries: 5
  delay: 1
  failed_when: false
  changed_when: false
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: wireguard_controller_existing_macos_wireguard_config.stat.exists

- name: Decide whether every existing Lima UDP forward is ready
  ansible.builtin.set_fact:
    wireguard_controller_existing_lima_udp_ready: >-
      {{
        wireguard_controller_existing_macos_wireguard_config.stat.exists
        and (
        wireguard_controller_existing_lima_udp_forward.results | default([])
        | rejectattr('skipped', 'defined')
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | list | length == lima_nodes | length
        )
      }}

- name: Test ordinary Lima access only to identify recreated unlocked guests
  ansible.builtin.command:
    argv: [limactl, shell, "{{ item.name }}", --, 'true']
  register: wireguard_controller_recreated_lima_paths
  failed_when: false
  changed_when: false
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - wireguard_controller_existing_macos_wireguard_config.stat.exists
    - not (wireguard_controller_existing_lima_udp_ready | bool)

- name: Decide whether existing controller state points to recreated unlocked guests
  ansible.builtin.set_fact:
    wireguard_controller_rebootstrap_required: >-
      {{
        wireguard_controller_existing_macos_wireguard_config.stat.exists
        and not (wireguard_controller_existing_lima_udp_ready | bool)
        and (
          wireguard_controller_recreated_lima_paths.results | default([])
          | rejectattr('skipped', 'defined')
          | selectattr('rc', 'defined')
          | selectattr('rc', 'equalto', 0)
          | list | length == lima_nodes | length
        )
      }}

- name: Refuse controller recovery from legacy locked guests
  ansible.builtin.assert:
    that:
      - >-
        not wireguard_controller_existing_macos_wireguard_config.stat.exists or
        (wireguard_controller_existing_lima_udp_ready | bool) or
        (wireguard_controller_rebootstrap_required | bool)
    fail_msg: >-
      Lima did not create every project WireGuard UDP forward. The existing
      guests contain the legacy manual-wg-firewall.service that
      locks SSH before Lima can connect its guest agent and create dynamic UDP
      forwarding. This controller cannot bypass that guest firewall. Recover
      the unit from each VM's serial console, or recreate disposable local VMs
      with `task lima-destroy CONFIRM=destroy-templ-local`, `task lima-up`, and `task
      wg-up PROVIDER=templ-local`. Existing Vault and controller configuration will
      be reused while the tracked startup gate is installed before lockdown.
  when: wireguard_controller_existing_macos_wireguard_config.stat.exists

- name: Derive the generated controller WireGuard public key
  ansible.builtin.command:
    argv: [wg, pubkey]
    stdin: "{{ vault_wireguard_private_keys.macos }}"
  register: wireguard_controller_public_key
  changed_when: false
  no_log: true

- name: Read controller interfaces before recovery
  ansible.builtin.command:
    argv: [ifconfig]
  register: wireguard_controller_interfaces_before_recovery
  changed_when: false

- name: Read the generated controller WireGuard runtime name before recovery
  ansible.builtin.command:
    argv: [cat, /var/run/wireguard/wg.name]
  register: wireguard_controller_runtime_name_before_recovery
  become: true
  failed_when: false
  changed_when: false
  no_log: true

- name: Read the generated controller WireGuard runtime public key before recovery
  ansible.builtin.command:
    argv:
      - wg
      - show
      - "{{ wireguard_controller_runtime_name_before_recovery.stdout | trim }}"
      - public-key
  register: wireguard_controller_runtime_public_key_before_recovery
  become: true
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - wireguard_controller_runtime_name_before_recovery.rc == 0
    - wireguard_controller_runtime_name_before_recovery.stdout | trim is match('^utun[0-9]+$')

- name: Read the generated controller WireGuard runtime address before recovery
  ansible.builtin.command:
    argv:
      - ifconfig
      - "{{ wireguard_controller_runtime_name_before_recovery.stdout | trim }}"
  register: wireguard_controller_runtime_address_before_recovery
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - wireguard_controller_runtime_name_before_recovery.rc == 0
    - wireguard_controller_runtime_name_before_recovery.stdout | trim is match('^utun[0-9]+$')

- name: Determine whether the exact generated controller WireGuard runtime is active
  ansible.builtin.set_fact:
    wireguard_controller_config_active: >-
      {{
        wireguard_controller_runtime_name_before_recovery.rc == 0
        and (wireguard_controller_runtime_name_before_recovery.stdout | trim
          is match('^utun[0-9]+$'))
        and (wireguard_controller_runtime_public_key_before_recovery.rc | default(1)) == 0
        and (wireguard_controller_runtime_public_key_before_recovery.stdout | default('') | trim)
          == (wireguard_controller_public_key.stdout | trim)
        and (wireguard_controller_runtime_address_before_recovery.rc | default(1)) == 0
        and ('inet ' ~ wireguard_macos_address ~ ' '
          in (wireguard_controller_runtime_address_before_recovery.stdout | default('')))
      }}
  no_log: true

- name: Refuse an unrelated WireGuard interface at the template-local project address
  ansible.builtin.assert:
    that:
      - >-
        wireguard_controller_config_active | bool or
        ('inet ' ~ wireguard_macos_address ~ ' '
        not in wireguard_controller_interfaces_before_recovery.stdout)
    fail_msg: >-
      {{ wireguard_macos_address }} is active on macOS, but it does not belong
      to this project's generated wg.conf. Stop the previous template-local WireGuard
      interface before rerunning task wg-up. This task will not stop an
      unknown interface automatically.

- name: Restore an existing macOS WireGuard interface before any Lima access
  ansible.builtin.command:
    argv: [wg-quick, up, "{{ wireguard_state_dir }}/wg.conf"]
  become: true
  when:
    - wireguard_controller_existing_macos_wireguard_config.stat.exists
    - not (wireguard_controller_config_active | bool)
  changed_when: true

- name: Record the restored controller WireGuard configuration as active
  ansible.builtin.set_fact:
    wireguard_controller_config_active: true
  when:
    - wireguard_controller_existing_macos_wireguard_config.stat.exists
    - not (wireguard_controller_config_active | bool)

- name: Read controller interfaces after recovery
  ansible.builtin.command:
    argv: [ifconfig]
  register: wireguard_controller_interfaces_after_recovery
  changed_when: false

- name: Test existing WireGuard management paths before using Lima
  ansible.builtin.command:
    argv:
      - ssh
      - -F
      - /dev/null
      - -i
      - "{{ lima_home_dir }}/_config/user"
      - -o
      - IdentitiesOnly=yes
      - -o
      - BatchMode=yes
      - -o
      - ControlMaster=no
      - -o
      - ControlPath=none
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - "UserKnownHostsFile={{ wireguard_known_hosts }}"
      - -o
      - ConnectTimeout=5
      - "{{ wireguard_guest_user }}@{{ item.wg_address }}"
      - 'true'
  register: wireguard_controller_existing_paths
  until: wireguard_controller_existing_paths.rc == 0
  retries: 30
  delay: 1
  failed_when: false
  changed_when: false
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - wireguard_controller_existing_macos_wireguard_config.stat.exists
    - wireguard_controller_config_active | bool
    - wireguard_controller_existing_lima_udp_ready | bool

- name: Decide whether WireGuard is already a healthy management path
  ansible.builtin.set_fact:
    wireguard_controller_overlay_healthy: >-
      {{
        wireguard_controller_existing_macos_wireguard_config.stat.exists
        and (wireguard_controller_config_active | bool)
        and (
          wireguard_controller_existing_paths.results | default([])
          | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list | length
          == lima_nodes | length
        )
      }}

- name: Require the Lima SSH identity
  ansible.builtin.stat:
    path: "{{ lima_home_dir }}/_config/user"
  register: wireguard_controller_lima_identity

- name: Refuse to configure without the Lima SSH identity
  ansible.builtin.assert:
    that:
      - wireguard_controller_lima_identity.stat.exists
      - wireguard_controller_lima_identity.stat.mode == '0600'
    fail_msg: "The provider-scoped Lima SSH identity is missing or has unsafe permissions: {{ lima_home_dir }}/_config/user."

- name: Refuse unsafe ordinary Lima fallback for an existing WireGuard installation
  ansible.builtin.assert:
    that:
      - >-
        not wireguard_controller_existing_macos_wireguard_config.stat.exists or
        (wireguard_controller_overlay_healthy | bool) or
        (wireguard_controller_rebootstrap_required | bool)
    fail_msg: >-
      The project already has {{ wireguard_state_dir }}/wg.conf, but one or
      more WireGuard SSH paths did not recover. Refusing to fall back to
      ordinary Lima SSH because locked-down guests reject that path. Ensure
      task lima-up has started every guest and its UDP forward, then check the
      controller interface and WireGuard handshakes before rerunning wg-up.

- name: Require encrypted WireGuard keys from Ansible Vault
  ansible.builtin.assert:
    that:
      - vault_wireguard_private_keys is defined
      - vault_wireguard_public_keys is defined
      - vault_wireguard_private_keys.macos is string
      - vault_wireguard_public_keys.macos is string
  no_log: true

- name: Require encrypted WireGuard material for every VM
  ansible.builtin.assert:
    that:
      - vault_wireguard_private_keys[item.name] is string
      - vault_wireguard_public_keys[item.name] is string
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Create private controller WireGuard state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ wireguard_state_dir }}"
    - "{{ wireguard_state_dir }}/rendered"

- name: Create the private WireGuard known-hosts file
  ansible.builtin.file:
    path: "{{ wireguard_known_hosts }}"
    state: touch
    access_time: preserve
    modification_time: preserve
    mode: '0600'

- name: Clear stale WireGuard host keys only for proven recreated local guests
  ansible.builtin.copy:
    content: ''
    dest: "{{ wireguard_known_hosts }}"
    mode: '0600'
  when: wireguard_controller_rebootstrap_required | bool

- name: Render the macOS WireGuard configuration from Vault
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "{{ wireguard_state_dir }}/wg.conf"
    mode: '0600'
  no_log: true

- name: Render each VM WireGuard configuration from Vault
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_state_dir }}/rendered/{{ item.name }}.conf"
    mode: '0600'
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Bootstrap WireGuard into each VM through ordinary Lima access
  ansible.builtin.include_tasks: bootstrap-node.yml
  loop: "{{ lima_nodes }}"
  loop_control:
    loop_var: node
    label: "{{ node.name }}"
  when:
    - not (wireguard_controller_overlay_healthy | bool)
    - >-
      not wireguard_controller_existing_macos_wireguard_config.stat.exists or
      (wireguard_controller_rebootstrap_required | bool)

- name: Wait for Lima's UDP forwards after first WireGuard bootstrap
  ansible.builtin.command:
    argv: [lsof, -nP, -a, -c, limactl, "-iUDP:{{ item.wg_host_port }}"]
  register: wireguard_controller_first_install_lima_udp_forward
  until: wireguard_controller_first_install_lima_udp_forward.rc == 0
  retries: 30
  delay: 1
  changed_when: false
  loop: "{{ lima_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    not wireguard_controller_existing_macos_wireguard_config.stat.exists or
    (wireguard_controller_rebootstrap_required | bool)

- name: Bring up the macOS WireGuard interface when absent
  ansible.builtin.command:
    argv: [wg-quick, up, "{{ wireguard_state_dir }}/wg.conf"]
  become: true
  when: not (wireguard_controller_config_active | bool)
  changed_when: true
