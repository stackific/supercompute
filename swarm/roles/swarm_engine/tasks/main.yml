---
- name: Require the pinned Ubuntu 26.04 Docker platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version == '26.04'
      - ansible_facts.distribution_release == 'resolute'
      - ansible_facts.architecture in swarm_docker_architectures
    fail_msg: >-
      Docker Swarm requires Ubuntu 26.04 Resolute on ARM64 or AMD64;
      {{ inventory_hostname }} reports {{ ansible_facts.distribution | default('unknown') }}
      {{ ansible_facts.distribution_version | default('unknown') }}
      {{ ansible_facts.architecture | default('unknown') }}.

- name: Select the architecture-specific Docker artifacts
  ansible.builtin.set_fact:
    swarm_docker_architecture: "{{ swarm_docker_architectures[ansible_facts.architecture] }}"
    swarm_docker_selected_artifacts: >-
      {{ swarm_docker_artifacts[swarm_docker_architectures[ansible_facts.architecture]] }}

- name: Check for packages that conflict with Docker CE
  ansible.builtin.command:
    argv: [dpkg-query, --show, '--showformat=${db:Status-Abbrev}', "{{ item }}"]
  loop:
    - docker.io
    - docker-compose
    - docker-compose-v2
    - docker-doc
    - podman-docker
    - containerd
    - runc
  register: swarm_docker_conflicting_packages
  failed_when: false
  changed_when: false

- name: Refuse to replace conflicting container packages implicitly
  ansible.builtin.assert:
    that:
      - item.rc != 0 or not (item.stdout is match('^ii'))
    fail_msg: >-
      {{ inventory_hostname }} has conflicting package {{ item.item }} installed.
      Remove it deliberately before running swarm-up; this task does not replace
      unrelated container state.
  loop: "{{ swarm_docker_conflicting_packages.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read installed Docker runtime dependencies
  ansible.builtin.command:
    argv: [dpkg-query, --show, '--showformat=${db:Status-Abbrev}', "{{ item }}"]
  loop: "{{ swarm_docker_runtime_dependencies }}"
  register: swarm_docker_runtime_dependency_status
  failed_when: false
  changed_when: false

- name: Select missing Docker runtime dependencies
  ansible.builtin.set_fact:
    swarm_docker_missing_runtime_dependencies: >-
      {{ swarm_docker_runtime_dependencies |
         difference(
           swarm_docker_runtime_dependency_status.results |
           selectattr('stdout', 'match', '^ii') |
           map(attribute='item') |
           list
         ) }}

- name: Install missing Docker runtime dependencies from Ubuntu
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: "{{ swarm_docker_missing_runtime_dependencies }}"
    state: present
  become: true
  when: swarm_docker_missing_runtime_dependencies | length > 0

- name: Create the project-owned Docker package cache
  ansible.builtin.file:
    path: "{{ swarm_docker_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install SHA256-pinned Docker artifacts
  ansible.builtin.include_tasks: install-artifact.yml
  loop: "{{ swarm_docker_selected_artifacts }}"
  loop_control:
    loop_var: swarm_docker_artifact
    label: "{{ swarm_docker_artifact.package }}={{ swarm_docker_artifact.version }}"

- name: Hold the pinned Docker packages
  ansible.builtin.dpkg_selections:
    name: "{{ item.package }}"
    selection: hold
  loop: "{{ swarm_docker_selected_artifacts }}"
  loop_control:
    label: "{{ item.package }}"
  become: true

- name: Read installed Docker package versions
  ansible.builtin.command:
    argv: [dpkg-query, --show, '--showformat=${Version}', "{{ item.package }}"]
  loop: "{{ swarm_docker_selected_artifacts }}"
  loop_control:
    label: "{{ item.package }}"
  register: swarm_docker_installed_versions
  changed_when: false

- name: Require the exact pinned Docker package versions
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.version
    fail_msg: >-
      {{ item.item.package }} must be {{ item.item.version }} but is
      {{ item.stdout | default('absent', true) }}.
  loop: "{{ swarm_docker_installed_versions.results }}"
  loop_control:
    label: "{{ item.item.package }}"

- name: Enable and start Docker Engine
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  become: true

- name: Require the local WireGuard firewall service before extending it
  ansible.builtin.stat:
    path: /etc/systemd/system/manual-wg-firewall.service
  register: swarm_local_wireguard_firewall_service
  when: wireguard_firewall_source is defined

- name: Refuse local Swarm without the project WireGuard firewall
  ansible.builtin.assert:
    that:
      - swarm_local_wireguard_firewall_service.stat.exists
      - swarm_local_wireguard_firewall_service.stat.isreg
    fail_msg: >-
      Run task wg-up PROVIDER=templ-local before swarm-up so Swarm traffic remains
      restricted to the project WireGuard mesh.
  when: wireguard_firewall_source is defined

- name: Extend the local WireGuard firewall for baseline Swarm traffic
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.template', wireguard_firewall_source) }}"
    dest: /etc/wireguard/manual-wireguard-lockdown.nft
    owner: root
    group: root
    mode: '0600'
  register: swarm_local_wireguard_firewall
  become: true
  when: wireguard_firewall_source is defined

- name: Reload the local WireGuard firewall when its rules changed
  ansible.builtin.systemd_service:
    name: manual-wg-firewall.service
    state: restarted
  become: true
  when:
    - wireguard_firewall_source is defined
    - swarm_local_wireguard_firewall.changed

- name: Wait for the local WireGuard firewall after its restart
  ansible.builtin.command:
    argv: [nft, list, table, inet, manual_wireguard]
  register: swarm_local_wireguard_firewall_active
  until: swarm_local_wireguard_firewall_active.rc == 0
  retries: 30
  delay: 1
  become: true
  changed_when: false
  when:
    - wireguard_firewall_source is defined
    - swarm_local_wireguard_firewall.changed
