version: '3'

tasks:
  up:
    deps: [':bootstrap:sync', ':wireguard:syntax']
    cmds:
      - >-
        {{ if eq .PROVIDER "templ-prod" }}
        cd "{{.ROOT_DIR}}" &&
        uv run --locked python "{{.ROOT_DIR}}/scripts/prod-known-hosts.py"
        --inventory "{{.ROOT_DIR}}/inventories/{{.PROVIDER}}/hosts.yml"
        --known-hosts "{{.ROOT_DIR}}/.state/{{.PROVIDER}}/known_hosts"
        --reuse-existing &&
        bash "{{.ROOT_DIR}}/scripts/vault-prod-wireguard-ensure.sh" "{{.PROVIDER}}" &&
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --ask-become-pass playbooks/prod-wireguard-up.yml
        {{ else if eq .PROVIDER "templ-local" }}
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --ask-become-pass playbooks/wireguard-up.yml
        {{ else }}
        echo "Unknown PROVIDER '{{.PROVIDER}}'. Supported values: templ-local, templ-prod." >&2; exit 2
        {{ end }}

  remove:
    deps: [':bootstrap:sync', ':wireguard:syntax']
    cmds:
      - >-
        {{ if eq .PROVIDER "templ-prod" }}
        bash "{{.ROOT_DIR}}/scripts/disconnect-prod-wireguard.sh" "{{.PROVIDER}}"
        {{ else if eq .PROVIDER "templ-local" }}
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --ask-become-pass playbooks/wireguard-remove.yml
        {{ else }}
        echo "Unknown PROVIDER '{{.PROVIDER}}'. Supported values: templ-local, templ-prod." >&2; exit 2
        {{ end }}

  status:
    deps: [':bootstrap:sync', ':wireguard:syntax']
    cmds:
      - >-
        {{ if eq .PROVIDER "templ-prod" }}
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --ask-become-pass playbooks/prod-wireguard-status.yml
        {{ else if eq .PROVIDER "templ-local" }}
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --ask-become-pass playbooks/wireguard-status.yml
        {{ else }}
        echo "Unknown PROVIDER '{{.PROVIDER}}'. Supported values: templ-local, templ-prod." >&2; exit 2
        {{ end }}

  ssh:
    requires:
      vars: [NODE]
    cmds:
      - PROVIDER="{{.PROVIDER}}" NODE="{{.NODE}}" bash "{{.ROOT_DIR}}/scripts/wg-ssh.sh"

  ensure:
    deps: [':bootstrap:sync']
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/ensure-wireguard-running.sh" "{{.PROVIDER}}"

  syntax:
    deps: [':bootstrap:sync']
    cmds:
      - >-
        {{ if eq .PROVIDER "templ-prod" }}
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --syntax-check playbooks/prod-wireguard-up.yml &&
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --syntax-check playbooks/prod-wireguard-status.yml &&
        bash -n "{{.ROOT_DIR}}/scripts/disconnect-prod-wireguard.sh"
        {{ else if eq .PROVIDER "templ-local" }}
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --syntax-check playbooks/wireguard-up.yml &&
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --syntax-check playbooks/wireguard-remove.yml &&
        bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --syntax-check playbooks/wireguard-status.yml
        {{ else }}
        echo "Unknown PROVIDER '{{.PROVIDER}}'. Supported values: templ-local, templ-prod." >&2; exit 2
        {{ end }}
