version: '3'

tasks:
  sync:
    preconditions:
      - sh: command -v uv >/dev/null 2>&1
        msg: "Install uv first: https://docs.astral.sh/uv/getting-started/installation/"
    cmds:
      - uv sync --locked --managed-python

  clean:
    cmds:
      - rm -rf "{{.ROOT_DIR}}/.venv" "{{.ROOT_DIR}}/.ansible" "{{.ROOT_DIR}}/.uv-cache"
