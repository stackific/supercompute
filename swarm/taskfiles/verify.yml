version: '3'

tasks:
  baseline:
    deps: [':bootstrap:sync']
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" --syntax-check playbooks/verify.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" playbooks/verify.yml

  before:
    deps: [':bootstrap:sync']
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local playbooks/verify-before.yml

  after:
    deps: [':bootstrap:sync']
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local playbooks/verify-after.yml

  syntax:
    deps: [':bootstrap:sync']
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/lima-up.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/lima-destroy.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/wireguard-up.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/wireguard-remove.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/verify-before.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/verify-after.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/wireguard-status.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/garage-up.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/garage-down.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/garage-destroy.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/garage-status.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/swarm-up.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/swarm-down.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/swarm-status.yml
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" templ-local --syntax-check playbooks/verify.yml
