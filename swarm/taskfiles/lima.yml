version: '3'

tasks:
  up:
    deps: [':bootstrap:sync']
    preconditions:
      - sh: test "{{.PROVIDER}}" = "templ-local"
        msg: lima-up is template-local-only.
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" playbooks/lima-up.yml

  status:
    preconditions:
      - sh: test "{{.PROVIDER}}" = "templ-local"
        msg: lima-status is template-local-only.
    cmds:
      - LIMA_HOME="$(bash "{{.ROOT_DIR}}/scripts/lima-runtime-home.sh" "{{.PROVIDER}}")" limactl list

  destroy:
    deps: [':bootstrap:sync']
    preconditions:
      - sh: test "{{.PROVIDER}}" = "templ-local"
        msg: lima-destroy is template-local-only.
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" playbooks/lima-destroy.yml
