version: '3'

tasks:
  up:
    deps: [':bootstrap:sync']
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/vault-garage-ensure.sh" "{{.PROVIDER}}"
      - DOCKER_SWARM_STANDALONE_GARAGE=1 bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" playbooks/garage-up.yml

  down:
    deps: [':bootstrap:sync']
    cmds:
      - DOCKER_SWARM_STANDALONE_GARAGE=1 bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" playbooks/garage-down.yml

  status:
    deps: [':bootstrap:sync']
    cmds:
      - DOCKER_SWARM_STANDALONE_GARAGE=1 bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" playbooks/garage-status.yml

  destroy:
    deps: [':bootstrap:sync']
    preconditions:
      - sh: test "{{.CONFIRM}}" = "destroy-garage-data"
        msg: Re-run with CONFIRM=destroy-garage-data
    cmds:
      - DOCKER_SWARM_STANDALONE_GARAGE=1 bash "{{.ROOT_DIR}}/scripts/ansible-playbook.sh" "{{.PROVIDER}}" playbooks/garage-destroy.yml

  credentials:
    deps: [':bootstrap:sync']
    silent: true
    cmds:
      - bash "{{.ROOT_DIR}}/scripts/vault-garage-credentials.sh" "{{.PROVIDER}}"
