- name: Verify ordinary Lima access before WireGuard lockdown
  hosts: localhost
  gather_facts: true
  environment:
    LIMA_HOME: "{{ lima_runtime_home }}"
    LIMA_SSH_PORT_FORWARDER: "false"
  tasks:
    - name: Run pre-WireGuard acceptance checks
      ansible.builtin.include_role:
        name: wireguard_verify
        tasks_from: before
