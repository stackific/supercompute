---
- name: Show Docker Swarm status on every inventory node
  hosts: wireguard_nodes
  gather_facts: false
  vars:
    swarm_first_manager: "{{ groups['wireguard_nodes'][0] }}"
  tasks:
    - name: Read this node's Docker and Swarm status
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - '{% raw %}Node={{.Name}} Docker={{.ServerVersion}} Swarm={{.Swarm.LocalNodeState}} Manager={{.Swarm.ControlAvailable}} NodeID={{.Swarm.NodeID}}{% endraw %}'
      register: swarm_status_info
      become: true
      failed_when: false
      changed_when: false

    - name: Report this node's Docker and Swarm status
      ansible.builtin.debug:
        msg: >-
          {{ swarm_status_info.stdout
             if swarm_status_info.rc == 0
             else inventory_hostname ~ ': Docker Engine is unavailable' }}

    - name: List manager membership and scheduling availability
      ansible.builtin.command:
        argv: [docker, node, ls]
      register: swarm_status_nodes
      become: true
      changed_when: false
      when:
        - inventory_hostname == swarm_first_manager
        - swarm_status_info.rc == 0
        - "'Swarm=active Manager=true' in swarm_status_info.stdout"

    - name: Report manager membership and scheduling availability
      ansible.builtin.debug:
        var: swarm_status_nodes.stdout_lines
      when:
        - inventory_hostname == swarm_first_manager
        - swarm_status_nodes is not skipped

    - name: Read the labeled manager's backup timer state
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - "{{ deployment_name }}-backup.timer"
          - --property=ActiveState
          - --property=UnitFileState
          - --property=LastTriggerUSec
          - --property=NextElapseUSecRealtime
      register: swarm_status_backup_timer
      become: true
      failed_when: false
      changed_when: false
      when: swarm_run_on_backup | bool

    - name: Report the labeled manager's backup timer state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} backup timer:\n{{ swarm_status_backup_timer.stdout }}"
      when:
        - swarm_run_on_backup | bool
        - swarm_status_backup_timer is not skipped

    - name: Read the labeled manager's last backup result
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - "{{ deployment_name }}-backup.service"
          - --property=ActiveState
          - --property=Result
          - --property=ExecMainStatus
      register: swarm_status_backup_service
      become: true
      failed_when: false
      changed_when: false
      when: swarm_run_on_backup | bool

    - name: Report the labeled manager's last backup result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} last backup result:\n{{ swarm_status_backup_service.stdout }}"
      when:
        - swarm_run_on_backup | bool
        - swarm_status_backup_service is not skipped
