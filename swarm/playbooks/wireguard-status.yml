- name: Show macOS WireGuard status
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Show macOS WireGuard peers
      ansible.builtin.command:
        argv: [wg, show]
      become: true
      changed_when: false

- name: Show VM WireGuard status
  hosts: wireguard_nodes
  gather_facts: false
  serial: 1
  tasks:
    - name: Show VM WireGuard peer state
      ansible.builtin.command:
        argv: [wg, show, wg0]
      become: true
      changed_when: false
