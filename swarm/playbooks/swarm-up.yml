---
- name: Install the pinned Docker Engine on every mesh node
  hosts: wireguard_nodes
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Require exactly three active managers and one backup workload node
      ansible.builtin.assert:
        that:
          - deployment_name is string
          - deployment_name is match('^[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?$')
          - encryption_at_rest is boolean
          - groups['wireguard_nodes'] | length == 3
          - >-
            groups['wireguard_nodes'] |
            map('extract', hostvars, 'swarm_run_on_backup') |
            select('equalto', true) |
            list |
            length == 1
          - >-
            groups['wireguard_nodes'] |
            map('extract', hostvars, 'swarm_availability') |
            reject('equalto', 'active') |
            list |
            length == 0
          - swarm_node_address is string
          - swarm_node_address | length > 0
          - swarm_availability == 'active'
          - swarm_run_on_backup is boolean
        fail_msg: >-
          The baseline requires exactly three active managers, exactly one
          swarm_run_on_backup=true manager, and one private WireGuard
          swarm_node_address per node.

  roles:
    - secure_storage
    - swarm_engine
    - swarm_gvisor

  tasks:
    - name: Record this node's requested scheduling availability
      ansible.builtin.set_fact:
        swarm_availability_effective: "{{ swarm_availability | default('active') }}"
        swarm_run_on_backup_effective: "{{ swarm_run_on_backup | bool }}"

    - name: Read this node's current Swarm identity
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - '{% raw %}{{.Swarm.LocalNodeState}}|{{.Swarm.ControlAvailable}}|{{if .Swarm.Cluster}}{{.Swarm.Cluster.ID}}{{end}}|{{.Swarm.NodeID}}{% endraw %}'
      register: swarm_initial_info
      become: true
      changed_when: false

    - name: Parse this node's current Swarm identity
      ansible.builtin.set_fact:
        swarm_initial_fields: "{{ swarm_initial_info.stdout.split('|') }}"

    - name: Refuse unsupported or ambiguous Swarm state
      ansible.builtin.assert:
        that:
          - swarm_initial_fields | length == 4
          - swarm_initial_fields[0] in ['inactive', 'active']
        fail_msg: >-
          {{ inventory_hostname }} is in unsupported Docker Swarm state
          {{ swarm_initial_info.stdout | default('unknown', true) }}.

- name: Initialize or verify the first manager
  hosts: "{{ groups['wireguard_nodes'][0] }}"
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require an existing first node to be a manager
      ansible.builtin.assert:
        that:
          - swarm_initial_fields[0] == 'inactive' or swarm_initial_fields[1] == 'true'
        fail_msg: >-
          {{ inventory_hostname }} already belongs to a Swarm as a worker.
          Refusing to repurpose it implicitly.

    - name: Require every node to be inactive before creating a new baseline
      ansible.builtin.assert:
        that:
          - >-
            swarm_initial_fields[0] == 'active' or
            hostvars[item].swarm_initial_fields[0] == 'inactive'
        fail_msg: >-
          The first manager is inactive but another inventory node already
          belongs to a Swarm. Refusing to create a competing baseline.
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Initialize the Swarm on the first WireGuard node
      ansible.builtin.command:
        argv:
          - docker
          - swarm
          - init
          - --advertise-addr
          - "{{ swarm_node_address }}"
          - --data-path-addr
          - "{{ swarm_node_address }}"
          - --listen-addr
          - "{{ swarm_node_address }}:2377"
      become: true
      changed_when: true
      when: swarm_initial_fields[0] == 'inactive'

    - name: Read the initialized manager identity
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - '{% raw %}{{.Swarm.LocalNodeState}}|{{.Swarm.ControlAvailable}}|{{if .Swarm.Cluster}}{{.Swarm.Cluster.ID}}{{end}}|{{.Swarm.NodeID}}{% endraw %}'
      register: swarm_manager_info
      become: true
      changed_when: false

    - name: Record the baseline Swarm and first manager identities
      ansible.builtin.set_fact:
        swarm_cluster_id: "{{ swarm_manager_info.stdout.split('|')[2] }}"
        swarm_node_id: "{{ swarm_manager_info.stdout.split('|')[3] }}"

    - name: Require a healthy first manager identity
      ansible.builtin.assert:
        that:
          - swarm_manager_info.stdout.split('|')[0] == 'active'
          - swarm_manager_info.stdout.split('|')[1] == 'true'
          - swarm_cluster_id | length > 0
          - swarm_node_id | length > 0

    - name: Read the manager join token
      ansible.builtin.command:
        argv: [docker, swarm, join-token, --quiet, manager]
      register: swarm_manager_join_token
      become: true
      changed_when: false
      no_log: true

- name: Join or verify the remaining managers
  hosts: wireguard_nodes
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    swarm_first_manager: "{{ groups['wireguard_nodes'][0] }}"
  tasks:
    - name: Require an existing node to belong to this Swarm as a manager
      ansible.builtin.assert:
        that:
          - >-
            swarm_initial_fields[0] == 'inactive' or
            (
              swarm_initial_fields[0] == 'active' and
              swarm_initial_fields[1] == 'true' and
              swarm_initial_fields[2] == hostvars[swarm_first_manager].swarm_cluster_id
            )
        fail_msg: >-
          {{ inventory_hostname }} already belongs to another Swarm or is not
          a manager. Refusing to force it out or repurpose it implicitly.
      when: inventory_hostname != swarm_first_manager

    - name: Join this node to the baseline as a manager
      ansible.builtin.command:
        argv:
          - docker
          - swarm
          - join
          - --token
          - "{{ hostvars[swarm_first_manager].swarm_manager_join_token.stdout }}"
          - --advertise-addr
          - "{{ swarm_node_address }}"
          - --data-path-addr
          - "{{ swarm_node_address }}"
          - --listen-addr
          - "{{ swarm_node_address }}:2377"
          - --availability
          - "{{ swarm_availability_effective }}"
          - "{{ hostvars[swarm_first_manager].swarm_node_address }}:2377"
      become: true
      changed_when: true
      no_log: true
      when:
        - inventory_hostname != swarm_first_manager
        - swarm_initial_fields[0] == 'inactive'

    - name: Read this manager's reconciled identity
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - '{% raw %}{{.Swarm.LocalNodeState}}|{{.Swarm.ControlAvailable}}|{{if .Swarm.Cluster}}{{.Swarm.Cluster.ID}}{{end}}|{{.Swarm.NodeID}}{% endraw %}'
      register: swarm_reconciled_info
      become: true
      changed_when: false

    - name: Record this manager's node ID
      ansible.builtin.set_fact:
        swarm_node_id: "{{ swarm_reconciled_info.stdout.split('|')[3] }}"

    - name: Require this node to be a manager in the baseline Swarm
      ansible.builtin.assert:
        that:
          - swarm_reconciled_info.stdout.split('|')[0] == 'active'
          - swarm_reconciled_info.stdout.split('|')[1] == 'true'
          - swarm_reconciled_info.stdout.split('|')[2] == hostvars[swarm_first_manager].swarm_cluster_id
          - swarm_node_id | length > 0

- name: Reconcile manager scheduling availability
  hosts: "{{ groups['wireguard_nodes'][0] }}"
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read each manager's current scheduling availability
      ansible.builtin.command:
        argv:
          - docker
          - node
          - inspect
          - --format
          - '{% raw %}{{.Spec.Availability}}{% endraw %}'
          - "{{ hostvars[item].swarm_node_id }}"
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "{{ item }}"
      register: swarm_manager_availability
      become: true
      changed_when: false

    - name: Apply each manager's requested scheduling availability
      ansible.builtin.command:
        argv:
          - docker
          - node
          - update
          - --availability
          - "{{ hostvars[item.item].swarm_availability_effective }}"
          - "{{ hostvars[item.item].swarm_node_id }}"
      loop: "{{ swarm_manager_availability.results }}"
      loop_control:
        label: "{{ item.item }} -> {{ hostvars[item.item].swarm_availability_effective }}"
      become: true
      changed_when: true
      when: item.stdout != hostvars[item.item].swarm_availability_effective

    - name: Read each manager's backup workload label
      ansible.builtin.command:
        argv:
          - docker
          - node
          - inspect
          - --format
          - '{% raw %}{{ index .Spec.Labels "run_on_backup" }}{% endraw %}'
          - "{{ hostvars[item].swarm_node_id }}"
      loop: "{{ groups['wireguard_nodes'] }}"
      loop_control:
        label: "{{ item }}"
      register: swarm_manager_backup_labels
      become: true
      changed_when: false

    - name: Apply each manager's backup workload label
      ansible.builtin.command:
        argv:
          - docker
          - node
          - update
          - --label-add
          - >-
            run_on_backup={{ hostvars[item.item].swarm_run_on_backup_effective |
                              ternary('true', 'false') }}
          - "{{ hostvars[item.item].swarm_node_id }}"
      loop: "{{ swarm_manager_backup_labels.results }}"
      loop_control:
        label: >-
          {{ item.item }} -> run_on_backup={{ hostvars[item.item].swarm_run_on_backup_effective |
                                              ternary('true', 'false') }}
      become: true
      changed_when: true
      when: >-
        item.stdout != (hostvars[item.item].swarm_run_on_backup_effective |
                        ternary('true', 'false'))

    - name: Show the reconciled three-manager Swarm
      ansible.builtin.command:
        argv: [docker, node, ls]
      register: swarm_reconciled_nodes
      become: true
      changed_when: false

    - name: Report the reconciled three-manager Swarm
      ansible.builtin.debug:
        var: swarm_reconciled_nodes.stdout_lines

- name: Remove backup ownership from managers without the backup label
  hosts: wireguard_nodes
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Remove the Swarm backup timer from this non-backup manager
      ansible.builtin.include_role:
        name: swarm_backup
      vars:
        swarm_backup_state: absent
      when: not (swarm_run_on_backup | bool)

- name: Install the backup timer only on the labeled active manager
  hosts: wireguard_nodes
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Install the Swarm backup timer on this labeled active manager
      ansible.builtin.include_role:
        name: swarm_backup
      vars:
        swarm_backup_state: present
      when: swarm_run_on_backup | bool
