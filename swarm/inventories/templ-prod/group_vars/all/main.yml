---
# Production is provider-neutral: three Ubuntu 26.04 AMD64 servers plus their
# public bootstrap endpoints in hosts.yml. Normal management uses this
# project's WireGuard mesh.
project_root: "{{ playbook_dir | dirname }}"
provider_state_dir: "{{ project_root }}/.state/{{ inventory_slug }}"
prod_connection: ssh
prod_default_ssh_user: ops
prod_default_ssh_port: 22
prod_known_hosts: "{{ provider_state_dir }}/known_hosts"

prod_wireguard_interface: scwg0
prod_wireguard_network_cidr: 10.217.79.0/24
prod_wireguard_prefix_length: 24
prod_wireguard_controller_address: 10.217.79.1
prod_wireguard_listen_port: 51830
prod_wireguard_tools_version: "1.0.20250521-1ubuntu1"
prod_wireguard_state_dir: "{{ provider_state_dir }}/wireguard"
prod_wireguard_config_path: "{{ prod_wireguard_state_dir }}/{{ prod_wireguard_interface }}.conf"
prod_wireguard_launchd_label: "com.stackific.{{ deployment_name }}.{{ inventory_slug }}.wireguard"
prod_wireguard_launchd_path: "/Library/LaunchDaemons/{{ prod_wireguard_launchd_label }}.plist"
prod_wireguard_node_addresses:
  templ-prod-1: 10.217.79.11
  templ-prod-2: 10.217.79.12
  templ-prod-3: 10.217.79.13

# Configure one private bucket or prefix at any S3-compatible provider (R2,
# AWS S3, Backblaze B2 S3, Wasabi, Tigris, and similar). Use the service base
# endpoint without the bucket name or trailing slash. Credentials belong only
# in the encrypted template-production Vault under the two variables referenced below.
swarm_backup_s3_endpoint: "REPLACE_WITH_S3_ENDPOINT"
swarm_backup_s3_require_https: true
swarm_backup_s3_bucket: "REPLACE_WITH_PRIVATE_BUCKET"
swarm_backup_s3_region: "auto"
swarm_backup_s3_bucket_lookup: auto
swarm_backup_s3_access_key: "{{ vault_swarm_backup_s3_access_key | default('') }}"
swarm_backup_s3_secret_key: "{{ vault_swarm_backup_s3_secret_key | default('') }}"
swarm_backup_object_prefix: "{{ deployment_name }}/{{ inventory_slug }}/swarm-state/v1"

node_ubuntu_version: "26.04"
node_ubuntu_codename: resolute
node_host_architecture: x86_64
