version: '3'

env:
  ANSIBLE_HOME: "{{.ROOT_DIR}}/.ansible"
  UV_CACHE_DIR: "{{.ROOT_DIR}}/.uv-cache"

vars:
  DEFAULT_PROVIDER: '{{.PROVIDER | default "templ-local"}}'

includes:
  bootstrap:
    taskfile: ./taskfiles/bootstrap.yml
    internal: true
  vault:
    taskfile: ./taskfiles/vault.yml
    internal: true
  reset:
    taskfile: ./taskfiles/reset.yml
    internal: true
  lima:
    taskfile: ./taskfiles/lima.yml
    internal: true
  wireguard:
    taskfile: ./taskfiles/wireguard.yml
    internal: true
  swarm:
    taskfile: ./taskfiles/swarm.yml
    internal: true
  garage:
    taskfile: ./taskfiles/garage.yml
    internal: true
  verify:
    taskfile: ./taskfiles/verify.yml
    internal: true

tasks:
  setup:
    desc: Lock and sync the shared uv-managed Ansible controller
    cmds:
      - task: bootstrap:sync

  clean-python:
    desc: Remove shared uv and Ansible runtime artifacts
    cmds:
      - task: bootstrap:clean

  vault-init:
    desc: Initialize a provider Vault (PROVIDER=templ-local|templ-prod)
    cmds:
      - task: vault:init
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"

  vault-edit:
    desc: Edit a provider Vault using $EDITOR (PROVIDER=templ-local|templ-prod)
    cmds:
      - task: vault:edit
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"

  reset:
    desc: Reset template-local state or remove the template-production Vault pair
    requires:
      vars: [CONFIRM]
    preconditions:
      - sh: test "{{.DEFAULT_PROVIDER}}" = "templ-local" || test "{{.DEFAULT_PROVIDER}}" = "templ-prod"
        msg: PROVIDER must be templ-local or templ-prod.
    cmds:
      - task: reset:all
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"
          CONFIRM: "{{.CONFIRM}}"

  lima-up:
    desc: Create or start the three pinned template-local Lima VMs
    requires:
      vars:
        - name: PROVIDER
          enum: [templ-local]
    cmds:
      - task: lima:up
        vars:
          PROVIDER: "{{.PROVIDER}}"

  lima-status:
    desc: Show the project-owned template-local Lima VM status
    requires:
      vars:
        - name: PROVIDER
          enum: [templ-local]
    cmds:
      - task: lima:status
        vars:
          PROVIDER: "{{.PROVIDER}}"

  lima-destroy:
    desc: Destroy the three project-owned template-local Lima VMs and disks
    requires:
      vars:
        - name: PROVIDER
          enum: [templ-local]
        - CONFIRM
    preconditions:
      - sh: test "{{.CONFIRM}}" = "destroy-templ-local"
        msg: Re-run with CONFIRM=destroy-templ-local
    cmds:
      - task: lima:destroy
        vars:
          PROVIDER: "{{.PROVIDER}}"

  wg-up:
    desc: Configure the provider's project-managed WireGuard mesh
    cmds:
      - task: wireguard:up
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"

  wg-remove:
    desc: Remove template-local WireGuard or disconnect only the template-production controller
    cmds:
      - task: wireguard:remove
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"

  wg-status:
    desc: Show macOS and server status for the provider's WireGuard mesh
    cmds:
      - task: wireguard:status
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"

  wg-ssh:
    desc: Open an interactive WireGuard SSH session to a provider NODE
    requires:
      vars: [NODE]
    cmds:
      - task: wireguard:ssh
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"
          NODE: "{{.NODE}}"

  wg-verify-before:
    desc: Prove ordinary Lima access before WireGuard lockdown
    preconditions:
      - sh: test "{{.DEFAULT_PROVIDER}}" = "templ-local"
        msg: wg-verify-before is template-local-only.
    cmds:
      - task: verify:before

  wg-verify-after:
    desc: Prove the template-local WireGuard mesh and management firewall policy
    preconditions:
      - sh: test "{{.DEFAULT_PROVIDER}}" = "templ-local"
        msg: wg-verify-after is template-local-only.
    cmds:
      - task: verify:after

  swarm-up:
    desc: Create or reconcile the provider's three-manager Docker Swarm
    preconditions:
      - sh: test "{{.DEFAULT_PROVIDER}}" = "templ-local" || test "{{.DEFAULT_PROVIDER}}" = "templ-prod"
        msg: PROVIDER must be templ-local or templ-prod.
    cmds:
      - task: swarm:up
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"

  swarm-down:
    desc: Make the provider's three nodes leave Docker Swarm
    preconditions:
      - sh: test "{{.DEFAULT_PROVIDER}}" = "templ-local" || test "{{.DEFAULT_PROVIDER}}" = "templ-prod"
        msg: PROVIDER must be templ-local or templ-prod.
    cmds:
      - task: swarm:down
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"

  swarm-status:
    desc: Show Docker Swarm membership, manager state, and availability
    preconditions:
      - sh: test "{{.DEFAULT_PROVIDER}}" = "templ-local" || test "{{.DEFAULT_PROVIDER}}" = "templ-prod"
        msg: PROVIDER must be templ-local or templ-prod.
    cmds:
      - task: swarm:status
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"

  verify:
    desc: Verify the provider baseline with a temporary gVisor Swarm workload
    preconditions:
      - sh: test "{{.DEFAULT_PROVIDER}}" = "templ-local" || test "{{.DEFAULT_PROVIDER}}" = "templ-prod"
        msg: PROVIDER must be templ-local or templ-prod.
    cmds:
      - task: verify:baseline
        vars:
          PROVIDER: "{{.DEFAULT_PROVIDER}}"

  garage-up:
    desc: Start standalone template-local Vault-backed Garage in Lima's shared default profile
    cmds:
      - task: garage:up
        vars:
          PROVIDER: templ-local

  garage-down:
    desc: Stop standalone template-local Garage while preserving its Docker volumes
    cmds:
      - task: garage:down
        vars:
          PROVIDER: templ-local

  garage-destroy:
    desc: Permanently delete recognized standalone Garage objects and volumes
    requires:
      vars: [CONFIRM]
    preconditions:
      - sh: test "{{.CONFIRM}}" = "destroy-garage-data"
        msg: Re-run with CONFIRM=destroy-garage-data
    cmds:
      - task: garage:destroy
        vars:
          PROVIDER: templ-local

  garage-status:
    desc: Show standalone template-local Garage status
    cmds:
      - task: garage:status
        vars:
          PROVIDER: templ-local

  garage-credentials:
    desc: Print shell exports for the template-local Garage S3 endpoint
    silent: true
    cmds:
      - task: garage:credentials
        vars:
          PROVIDER: templ-local

  syntax-check:
    desc: Syntax-check every template-local playbook
    preconditions:
      - sh: test "{{.DEFAULT_PROVIDER}}" = "templ-local"
        msg: syntax-check validates the template-local playbook set.
    cmds:
      - task: verify:syntax

  check-contracts:
    desc: Check every no-network Garage, WireGuard, and Swarm safety contract
    deps: [setup]
    cmds:
      - uv run --locked python -m unittest tests.test_garage_credentials tests.test_garage_standalone tests.test_reset_wireguard tests.test_prod_wireguard_disconnect tests.test_prod_reset tests.test_lima_status tests.test_lima_runtime_home tests.test_lima_lockdown_startup tests.test_swarm_baseline tests.test_swarm_backup tests.test_secure_storage
      - uv run --locked python -m unittest tests.test_prod_known_hosts
