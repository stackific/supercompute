---
# Short stable id for this project (lowercase DNS label).
# Changing it later creates new unit names, local paths, labels, and object
# prefixes; it does not migrate existing state.
# Must match the Ansible Vault ID label on inventories/<provider>/group_vars/all/vault.yml
# (encrypt header …;AES256;<project>-<provider>) and vault_meta.project.
project: example

# Public domain / apex hostname served by this project.
# Also seeds macOS LaunchDaemon reverse-DNS (example.com → com.example).
hostname: example.tanzimsaqib.com

# Nameserver hostname for DNS delegation managed outside this automation.
nameserver_hostname: ns.example.tanzimsaqib.com
